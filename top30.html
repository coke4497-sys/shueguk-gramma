<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUEGUK 문법 슈스 탑30</title>
<meta name="description" content="이수경국어 문법 테스트 — 문법 슈스 탑30(클리어 스테이지 · 플레이 점수)" />
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Do+Hyeon&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif; background: #C6D5D2; min-height: 100vh; padding: 14px; padding-bottom: 60px; color: #2C2F2D; -webkit-text-size-adjust: 100%; }
.container { max-width: 580px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
/* 2026-09-18 디자인 지시서(stats.html 탑30과 같은 값) — 학생 홈 색 규칙: 강조 #EDE4F4/#5A4A6A, 본문 #2A332F, 보조 #4F5C56, 캡션 #5C6A64, 그림자 없음 */
.header { padding: 18px 20px 16px; background: #fff; border-radius: 18px; display: flex; flex-direction: column; gap: 6px; }
.header .logo { font-size: 10.5px; font-weight: 400; color: #8B978F; letter-spacing: .24em; }
.header h1 { font-family: 'Gowun Batang', serif; font-size: 22px; font-weight: 700; color: #2A332F; letter-spacing: -.5px; }
.header .intro { font-size: 11.5px; color: #4F5C56; line-height: 1.6; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ftab { font: inherit; font-size: 12px; font-weight: 400; padding: 7px 13px; border-radius: 999px; background: #F2F5F3; color: #4F5C56; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ftab.on { background: #EDE4F4; color: #5A4A6A; font-weight: 700; }
.me { background: #EDE4F4; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 12px; }
.me .rk { font-family: 'Do Hyeon', sans-serif; font-size: 26px; color: #5A4A6A; min-width: 48px; }
.me .nm { font-size: 14px; font-weight: 700; color: #2A332F; }
.me .nm span { font-weight: 400; font-size: 12px; color: #5A4A6A; }
.me .d { font-size: 12px; color: #5A4A6A; margin-top: 2px; }
.topcard { background: #fff; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.status { padding: 18px 16px; font-size: 13px; color: #4F5C56; text-align: center; line-height: 1.7; }
.status.fail { color: #992F20; }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 10px; align-items: end; padding: 22px 16px 18px; background: linear-gradient(#FBFAFC, #fff); }
.pod { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; min-width: 0; }
.pod .pn { font-family: 'Gowun Batang', serif; font-size: 15px; font-weight: 700; color: #2A332F; }
.pod .pn span { font-family: 'Gowun Dodum', sans-serif; font-size: 11px; font-weight: 400; color: #5C6A64; display: block; margin-top: 2px; }
.pod .pd { font-size: 11.5px; color: #4F5C56; }
.pod .mine-tag { display: inline-block; font-family: 'Gowun Dodum', sans-serif; font-size: 10px; font-weight: 700; color: #5A4A6A; background: #EDE4F4; border-radius: 999px; padding: 1px 6px; margin-left: 4px; vertical-align: middle; }
.pod-bar { width: 100%; border-radius: 12px 12px 6px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #fff; }
.pod-bar .r { font-size: 22px; font-weight: 700; line-height: 1; }
.pod-bar .p { font-size: 12.5px; font-weight: 700; }
.pod-bar .p i { font-style: normal; font-size: 10.5px; font-weight: 400; opacity: .85; }
.pod.p1 .pod-bar { height: 92px; background: #5A4A6A; }
.pod.p2 .pod-bar { height: 72px; background: #8E7BA3; }
.pod.p3 .pod-bar { height: 60px; background: #C9B6DB; color: #3F2F4F; }
.top-head { display: grid; grid-template-columns: 36px 1fr 120px 84px; gap: 12px; padding: 8px 16px; border-top: 1px solid #F0F4F1; background: #F7F9F8; font-size: 11px; color: #5C6A64; }
.top-head .r, .row .pt { text-align: right; }
.row { display: grid; grid-template-columns: 36px 1fr 120px 84px; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #F0F4F1; }
.row.mine { background: #FAF7FC; }
.rk { width: 30px; height: 30px; border-radius: 9px; background: #F2F5F3; color: #3F4A44; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; }
.row .nm { font-size: 13.5px; font-weight: 700; color: #2A332F; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.row .nm span { font-weight: 400; font-size: 11.5px; color: #5C6A64; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .st { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #4F5C56; white-space: nowrap; }
.row .bar { flex: 1; height: 5px; border-radius: 99px; background: #EEF2EF; overflow: hidden; }
.row .bar i { display: block; height: 100%; background: #B9A5CC; border-radius: 99px; }
.row .pt { font-size: 13.5px; font-weight: 700; color: #2A332F; font-variant-numeric: tabular-nums; }
.row .pt i { font-style: normal; font-size: 11px; font-weight: 400; color: #5C6A64; }
.top-foot { padding: 13px 16px; border-top: 1px solid #F0F4F1; display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: #5C6A64; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #4F5C56; text-decoration: none; }
.back svg { width: 15px; height: 15px; }
@media (max-width: 480px) {
  .top-head, .row { grid-template-columns: 30px 1fr 84px; }
  .top-head span:nth-child(3), .row .st { display: none; }
  .podium { gap: 6px; padding: 18px 10px 14px; }
  .pod .pn { font-size: 13.5px; }
}
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">SHUEGUK</div>
    <h1>문법 슈스 탑30</h1>
    <div class="intro">클리어한 스테이지 수 → 플레이 점수 순 · 슈퍼스타 랭킹과는 별개예요</div>
    <div class="filters">
      <button type="button" class="ftab on" data-level="all">전체</button>
      <button type="button" class="ftab" data-level="mid">중등</button>
      <button type="button" class="ftab" data-level="high">고등</button>
      <button type="button" class="ftab" data-month="1">이번 달</button>
    </div>
  </div>
  <div id="me" class="me hidden"></div>
  <div class="topcard">
    <div id="status" class="status">순위를 불러오는 중…</div>
    <div id="podium" class="podium hidden"></div>
    <div id="head" class="top-head hidden"><span>순위</span><span>학생</span><span>클리어 스테이지</span><span class="r">플레이 점수</span></div>
    <div id="list" class="hidden"></div>
    <div id="foot" class="top-foot hidden"><span id="foot-l"></span><span id="foot-r"></span></div>
  </div>
  <a class="back" id="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>문법 스테이지로</a>
</div>
<script>
(function() {
    var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
    var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
    var LS_KEY = 'gramma_student';
    function $(id) { return document.getElementById(id); }
    function esc(s) { return ('' + (s == null ? '' : s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function fmt(n) { return ('' + (n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    var params = new URLSearchParams(location.search), saved = {};
    try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) {}
    var who = { name: (params.get('name') || saved.name || '').trim(), school: (params.get('school') || saved.school || '').trim(), grade: (params.get('grade') || saved.grade || '').trim(), phone8: ((params.get('p8') || saved.phone8 || '') + '').replace(/[^0-9]/g, '').slice(0, 8) };
    if (who.name) $('back').href = 'index.html?name=' + encodeURIComponent(who.name) + '&school=' + encodeURIComponent(who.school) + '&grade=' + encodeURIComponent(who.grade) + '&p8=' + encodeURIComponent(who.phone8);
    var level = 'all', month = false;
    function monthStr() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
    function load() {
        $('status').className = 'status'; $('status').textContent = '순위를 불러오는 중…'; $('status').classList.remove('hidden');
        ['podium', 'head', 'list', 'foot', 'me'].forEach(function(id) { $(id).classList.add('hidden'); });
        var p = { level: level, month: month ? monthStr() : '' };
        if (who.name && /^[0-9]{8}$/.test(who.phone8)) { p.name = who.name; p.phone8 = who.phone8; }
        fetch(SB_URL + '/rest/v1/rpc/gramma_top', { method: 'POST', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p: p }) })
            .then(function(r) { return r.json(); }).then(render)
            .catch(function() { $('status').className = 'status fail'; $('status').textContent = '순위를 불러오지 못했어요. 인터넷을 확인하고 다시 열어 주세요.'; });
    }
    function levelLabel() { return (level === 'mid' ? '중등' : level === 'high' ? '고등' : '전체') + ' 기준'; }
    // 시상대(1~3위) + 4위 이하 표 — stats.html 탑30과 같은 디자인(2026-09-18). 막대 분모 = 1위 스테이지 수.
    function render(res) {
        if (!res || res.ok !== true) { $('status').className = 'status fail'; $('status').classList.remove('hidden'); $('status').textContent = '순위를 불러오지 못했어요.'; return; }
        var rows = res.rows || [];
        ['podium', 'head', 'list', 'foot'].forEach(function(id) { $(id).classList.add('hidden'); });
        if (!rows.length) { $('status').className = 'status'; $('status').classList.remove('hidden'); $('status').textContent = (month ? '이번 달' : '아직') + ' 기록이 없어요. 스테이지를 클리어하면 여기에 올라와요.'; $('me').classList.add('hidden'); return; }
        $('status').classList.add('hidden');
        var me = res.me;
        if (me) {
            $('me').innerHTML = '<div class="rk">' + me.rank + '위</div><div><div class="nm">' + esc(who.name) + ' <span>' + esc(who.school) + ' ' + esc(who.grade) + '</span></div><div class="d">스테이지 ' + me.stages + ' · ' + fmt(me.points) + '점 · 별 ' + me.stars + (me.rank > 1 && rows[Math.min(me.rank, rows.length) - 2] ? ' · ' + (me.rank - 1) + '위까지 ' + fmt(Math.max(0, rows[Math.min(me.rank, rows.length) - 2].points - me.points)) + '점' : '') + '</div></div>';
            $('me').classList.remove('hidden');
        } else $('me').classList.add('hidden');
        function isMine(r) { return !!(me && r.rank === me.rank && r.name === who.name); }
        var maxSt = rows.reduce(function(m, r) { return Math.max(m, Number(r.stages) || 0); }, 0) || 1;
        var byRank = {}; rows.forEach(function(r) { if (r.rank <= 3) byRank[r.rank] = r; });
        function pod(r) {
            if (!r) return '<div class="pod"></div>';
            return '<div class="pod p' + r.rank + (isMine(r) ? ' mine' : '') + '"><div class="pn">' + esc(r.name) + (isMine(r) ? '<span class="mine-tag">나</span>' : '') + '<span>' + esc(r.school) + ' ' + esc(r.grade) + '</span></div>' +
                '<div class="pd">스테이지 ' + r.stages + ' · 별 ' + r.stars + '</div>' +
                '<div class="pod-bar"><span class="r">' + r.rank + '</span><span class="p">' + fmt(r.points) + '<i> P</i></span></div></div>';
        }
        $('podium').innerHTML = pod(byRank[2]) + pod(byRank[1]) + pod(byRank[3]);
        $('podium').classList.remove('hidden');
        var rest = rows.filter(function(r) { return r.rank > 3; });
        if (rest.length) {
            $('list').innerHTML = rest.map(function(r) {
                var w = Math.round((Number(r.stages) || 0) / maxSt * 100);
                return '<div class="row' + (isMine(r) ? ' mine' : '') + '"><div class="rk">' + r.rank + '</div>' +
                    '<div class="nm">' + esc(r.name) + '<span>' + esc(r.school) + ' ' + esc(r.grade) + '</span></div>' +
                    '<div class="st">스테이지 ' + r.stages + '<span class="bar"><i style="width:' + w + '%"></i></span></div>' +
                    '<div class="pt">' + fmt(r.points) + '<i> P</i></div></div>';
            }).join('');
            $('head').classList.remove('hidden'); $('list').classList.remove('hidden');
        }
        $('foot-l').textContent = '전체 ' + res.total + '명 · 30위까지 표시';
        $('foot-r').textContent = (month ? '이번 달 · ' : '') + levelLabel();
        $('foot').classList.remove('hidden');
    }
    document.querySelectorAll('.ftab').forEach(function(b) {
        b.addEventListener('click', function() {
            if (b.getAttribute('data-month')) { month = !month; b.classList.toggle('on', month); }
            else { level = b.getAttribute('data-level'); document.querySelectorAll('.ftab[data-level]').forEach(function(x) { x.classList.toggle('on', x === b); }); }
            load();
        });
    });
    load();
})();
</script>
</body>
</html>
