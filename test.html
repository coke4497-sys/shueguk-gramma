<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUEGUK 문법</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif; background: #C6D5D2; min-height: 100vh; color: #2C2F2D; -webkit-text-size-adjust: 100%; }
.container { max-width: 580px; margin: 0 auto; padding: 12px 14px 60px; }

/* ===== 상단 고정 영역 — 제목 + 모드 토글 + 진행·제출 한 덩어리 (2026-09-13 사용자 디자인 지시) ===== */
.topbar { position: sticky; top: 0; z-index: 40; background: rgba(198,213,210,.96); border-bottom: 1px solid rgba(42,51,47,.07); padding: 16px 22px 12px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.tb-in { max-width: 580px; margin: 0 auto; }
.tb-row1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.tb-title { min-width: 0; }
.tb-title h1 { font-family: 'Gowun Batang', serif; font-size: 17px; font-weight: 700; color: #2A332F; line-height: 1.3; letter-spacing: -.2px; }
.tb-sub { font-size: 11.5px; color: #5C6A64; margin-top: 3px; }
.mode-tabs { display: flex; flex: none; background: #fff; border: 1px solid #E5EDE8; border-radius: 999px; padding: 3px; }
.mode-label { padding: 7px 15px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #65726B; cursor: pointer; user-select: none; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.mode-label.active { background: #EDE4F4; color: #6B5B7B; }
.mode-label .m-ic { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
.tb-row2 { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.tb-cnt { flex: none; font-size: 11.5px; color: #5C6A64; }
.pmini { flex: 1; height: 5px; border-radius: 99px; background: rgba(255,255,255,.6); overflow: hidden; min-width: 40px; }
.pmini i { display: block; height: 100%; width: 0; background: #B9A5CC; border-radius: 99px; transition: width .2s; }
#result-display { flex: none; font-size: 11.5px; font-weight: 800; color: #6B5B7B; }
.submit-btn { flex: none; font: inherit; font-size: 12px; font-weight: 700; padding: 6px 13px; border-radius: 999px; border: none; background: #EBF0ED; color: #65726B; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .15s, color .15s; }
.submit-btn.ready { background: #EDE4F4; color: #6B5B7B; }
.submit-btn:disabled { opacity: .6; cursor: default; }
@media (max-width: 420px){ .topbar { padding: 14px 16px 10px; } .tb-row1 { flex-wrap: wrap; } }

/* ===== 개념 정리 — 분류 칩 + 카드 위계 ===== */
.category-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
.cat-label { padding: 8px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: #fff; border: 1px solid #E5EDE8; color: #65726B; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.cat-label.active { background: #EDE4F4; border-color: #D6C9E4; color: #6B5B7B; }
.cat-count { margin-left: auto; font-size: 11.5px; color: #5C6A64; }
.cat-content { display: flex; flex-direction: column; gap: 10px; }
.vocab-card { background: #fff; border: 1px solid #E5EDE8; border-radius: 16px; padding: 16px 20px 18px; }
.vocab-word { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-family: 'Gowun Batang', serif; font-size: 17px; font-weight: 700; color: #2A332F; margin-bottom: 9px; }
.vocab-tag { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #EDE4F4; color: #6B5B7B; font-family: 'Gowun Dodum', sans-serif; font-size: 10.5px; font-weight: 800; letter-spacing: .2px; }
.vocab-meaning { border-left: 2px solid #DDE6E1; padding-left: 12px; font-size: 13px; line-height: 1.7; color: #5C6A64; }
.vocab-example { display: flex; align-items: flex-start; gap: 10px; margin-top: 11px; }
.vocab-example b { flex: none; font-size: 11px; font-weight: 700; color: #9BA8A1; margin-top: 8px; }
.ex-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-chip { padding: 7px 12px; border-radius: 9px; background: #F4F7F5; color: #2A332F; font-size: 12.5px; }
.note-box { background: #FBEECF; color: #8F630F; font-size: 12px; line-height: 1.6; padding: 11px 13px; border-radius: 10px; }

/* ===== 테스트 모드 — 학생 정보(접힘) ===== */
.student-info { background: #fff; border: 1px solid #E5EDE8; border-radius: 16px; padding: 14px 18px; margin-bottom: 10px; transition: border-color .15s; }
.student-info.collapsed { cursor: pointer; }
.student-info.open { border-color: #D6C9E4; }
.si-sum { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #2A332F; cursor: pointer; }
.si-sum .s-ic { flex: none; width: 16px; height: 16px; color: #6B5B7B; }
.si-sum .si-txt { flex: 1; min-width: 0; }
.si-sum .miss { color: #9BA8A1; }
.si-edit { flex: none; font: inherit; font-size: 11.5px; color: #9BA8A1; background: none; border: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.si-body { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #F0F4F1; }
.student-info.open .si-body { display: block; }
.si-title { font-size: 12px; font-weight: 800; color: #2A332F; margin-bottom: 10px; }
.si-title .req { font-size: 11px; font-weight: 400; color: #9BA8A1; margin-left: 6px; }
.si-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px 16px; }
.si-field label { display: block; font-size: 11px; color: #65726B; margin-bottom: 4px; }
.si-field input, .si-field select { width: 100%; padding: 10px 12px; font-size: 13px; font-family: inherit; border: 1px solid #E1E7E3; border-radius: 10px; outline: none; color: #2A332F; background: #fff; -webkit-appearance: none; appearance: none; }
.si-field input:focus, .si-field select:focus { border-color: #D6C9E4; }
.si-field select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239BA8A1' stroke-width='2.4'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 13px; padding-right: 28px; }
@media (max-width: 420px){ .si-grid { grid-template-columns: 1fr; } }

/* 지문(조항 원문·해설) — 한글 맞춤법 레벨2처럼 지문을 읽고 푸는 회차 (개념 카드와 같은 흰 상자) */
.psg { background: #fff; border: 1px solid #E5EDE8; border-radius: 16px; padding: 16px 20px 18px; margin-bottom: 10px; }
.psg-lbl { font-size: 11px; font-weight: 800; color: #635A7D; background: #EDE4F4; display: inline-block; padding: 3px 9px; border-radius: 999px; margin-bottom: 8px; }
.psg-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.psg-art { font-family: 'Gowun Batang', serif; font-size: 18px; font-weight: 800; color: #2C2F2D; }
.psg-chap { font-size: 12px; color: #6A716C; }
.psg-text { font-family: 'Gowun Batang', serif; font-size: 14.5px; line-height: 1.75; color: #2C2F2D; background: #E9F0EF; padding: 11px 13px; border-radius: 10px; }
.psg-body { margin-top: 10px; }
.psg-body p { font-size: 13px; line-height: 1.8; color: #3A3F3C; margin: 0 0 9px; padding: 0 2px; word-break: keep-all; }
.psg-body p:last-child { margin-bottom: 0; }
.psg-ex { background: #F4F7F5; border-radius: 10px; padding: 9px 12px; margin: 0 0 9px; font-size: 12.5px; line-height: 1.75; color: #2A332F; }
.psg-ex span { display: block; }
.psg-toggle { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font: inherit; font-size: 12px; font-weight: 800; color: #635A7D; background: #EDE4F4; border: none; border-radius: 9px; padding: 7px 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.psg-toggle svg { width: 13px; height: 13px; transition: transform .15s; }
.psg-toggle.open svg { transform: rotate(180deg); }
/* ===== 안내 문단 ===== */
.section-label { display: flex; align-items: flex-start; gap: 10px; background: #EBF0ED; border-radius: 14px; padding: 12px 16px; margin: 0 0 10px; font-size: 12.5px; line-height: 1.65; color: #5C6A64; }
.section-label .s-ic { flex: none; width: 15px; height: 15px; color: #65726B; margin-top: 3px; }
.section-label .dim { color: #9BA8A1; }
.section-label b { font-weight: 800; }

/* ===== 문항 카드 — 한 줄 배치 ===== */
#questions { display: flex; flex-direction: column; gap: 10px; }
.q-card { background: #fff; border: 1px solid #E5EDE8; border-radius: 16px; padding: 12px 16px; transition: border-color .15s; }
.q-card.filled { border-color: #D6C9E4; }
.q-card.correct { border-color: #3E9B74; background: #F1F6F4; }
.q-card.wrong { border-color: #EFA9A5; background: #FBE8E7; }
.q-line { display: flex; align-items: center; gap: 14px; }
.q-id { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.q-num { font-size: 11px; font-weight: 700; color: #9BA8A1; line-height: 1; }
.q-bar { display: block; width: 22px; height: 2px; border-radius: 9px; background: #E1E7E3; }
.q-card.filled .q-bar { background: #B9A5CC; }
.q-start { flex: none; font-family: 'Gowun Batang', serif; font-size: 16px; font-weight: 700; color: #2A332F; min-width: 74px; }
.q-steps { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.step-row { display: flex; align-items: center; gap: 10px; }
.step-arrow { flex: none; font-size: 13px; color: #BCC8C2; }
.hy { flex: none; width: 12px; text-align: center; font-weight: 800; color: #6B5B7B; }   /* 형태소 빈칸 앞뒤의 붙임표 표시 */
.hy.off { width: 12px; }
.rule-select { flex: 1; min-width: 0; padding: 9px 30px 9px 12px; font-size: 12.5px; font-family: inherit; border: 1px solid #E1E7E3; border-radius: 10px; outline: none; color: #2A332F; background: #fff; -webkit-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239BA8A1' stroke-width='2.4'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 10px center; background-size: 13px; }
.rule-select:focus { border-color: #D6C9E4; }
.step-row.two .rule-select { padding-right: 24px; padding-left: 10px; }   /* 드롭다운이 둘인 줄(형태소): 글자가 잘리지 않게 여백 축소 + 빈칸 폭 축소 */
.step-row.two .form-input { width: 104px; }
.step-row.two .rule-select.sel2 { flex: 0 0 96px; }
.form-input { flex: none; width: 130px; padding: 9px 12px; font-size: 13px; font-family: inherit; font-weight: 700; text-align: center; border-radius: 10px; background: #F4F7F5; border: 1px solid #E1E7E3; color: #2A332F; outline: none; -webkit-appearance: none; }
.form-input::placeholder { color: #9BA8A1; font-weight: 400; }
.form-input:focus { border-color: #D6C9E4; background: #fff; }
.form-input.has { background: #FAF7FC; border-color: #D6C9E4; color: #2A332F; }
.step-del { flex: none; width: 22px; height: 22px; border: none; border-radius: 7px; background: #F4F7F5; color: #9BA8A1; font: inherit; font-size: 13px; line-height: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.step-del:hover { color: #6B5B7B; background: #EDE4F4; }
.step-add { flex: none; width: 28px; height: 28px; border: none; border-radius: 9px; background: #F4F7F5; color: #65726B; font: inherit; font-size: 18px; line-height: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.step-add:hover { background: #EDE4F4; color: #6B5B7B; }
.step-add:disabled { opacity: .35; cursor: default; }
/* 선택지가 2~3개인 구분(형태소: 실질/형식 · 자립/의존)은 드롭다운 대신 알약 버튼 — 2026-09-14 사용자 "선택해야 하는 옵션에는 테두리 없는 연보라 알약".
   드롭다운은 안내 글('실질/형식')과 선택지가 같은 줄 모양이라 셋 중 하나를 고르는 것처럼 보였다. 값은 숨긴 select에 그대로 담아 채점 코드는 종전대로. */
.rule-select.hid { display: none; }
.pillset { display: flex; flex-wrap: wrap; gap: 6px 14px; flex: 1 1 200px; min-width: 0; align-items: center; }
.pills { display: inline-flex; align-items: center; gap: 5px; flex: none; }
.pills .pl-lab { font-size: 11px; color: #9BA8A1; margin-right: 3px; white-space: nowrap; }
.pill { font: inherit; font-size: 12.5px; font-weight: 700; line-height: 1; padding: 8px 13px; border-radius: 999px; border: none; background: #EDE4F4; color: #6B5B7B; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .12s, color .12s; }
.pill:hover { background: #E3D6EF; }
.pill.on, .pill.on:hover { background: #6B5B7B; color: #fff; }
.pills.done .pill { cursor: default; }
.pills.done .pill:not(.on) { background: #F0F3F1; color: #B7BFB9; }
.pills.ok .pill.on { background: #3E9B74; color: #fff; }
.pills.ng .pill.on { background: #C64F63; color: #fff; }
.pills.ng.none .pl-lab { color: #C64F63; }
.rule-select.ok, .form-input.ok { border-color: #3E9B74; background: #E4F1EA; }
.rule-select.ng, .form-input.ng { border-color: #EFA9A5; background: #FADED9; }
.q-hint { font-size: 12.5px; color: #6B5B7B; background: #EDE4F4; padding: 7px 11px; border-radius: 8px; margin: 10px 0 0; line-height: 1.5; }
.q-hint b { font-weight: 800; margin-right: 4px; }
@media (max-width: 520px){
  .q-line { flex-wrap: wrap; gap: 10px 12px; }
  .q-steps { flex-basis: 100%; order: 3; }
  .step-add { order: 2; margin-left: auto; }
  .form-input { width: 112px; }
  .step-row.two { gap: 6px; }
  .step-row.two .form-input { width: 76px; }
  .step-row.two .rule-select { padding: 9px 20px 9px 8px; font-size: 12px; background-position: right 6px center; }
  .step-row.two .rule-select.sel2 { flex: 1; }
  .step-row.two .hy { width: 9px; }
  .step-row.two { flex-wrap: wrap; }
  .step-row.two .pillset { flex-basis: 100%; padding-left: 22px; }
  .pill { padding: 8px 12px; font-size: 12px; }
}

/* 단답/OX/선택 문항 (배치는 그대로, 강조색만 통일) */
.q-stem { font-size: 13.5px; line-height: 1.75; margin: 6px 0 9px; }
.q-example { font-size: 12px; color: #6A716C; background: #F4F5F3; padding: 8px 11px; border-radius: 8px; margin: 6px 0; font-style: italic; }
.blank { display: inline-block; min-width: 50px; padding: 0 8px; border-bottom: 2px solid #628C83; color: #628C83; font-weight: 800; font-style: normal; }
.chosung { display: inline-block; background: #E9F0EF; border: 1.5px solid #A6C1BB; color: #3A544E; padding: 1px 8px; border-radius: 6px; font-weight: 800; margin-left: 6px; font-size: 12px; }
.boxki { background: #E9F0EF; border: 1.5px dashed #A6C1BB; border-radius: 10px; padding: 10px 12px; margin: 0; font-size: 12px; color: #3A544E; }
.boxki b { display: block; margin-bottom: 4px; font-size: 11px; }
.boxki-words { display: flex; flex-wrap: wrap; gap: 6px; }
.boxki-word { background: white; border: 1.5px solid #A6C1BB; color: #3A544E; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 12px; }
.answer-input { width: 100%; padding: 11px 12px; font-size: 14px; font-family: inherit; font-weight: 700; border: 1px solid #E1E7E3; border-radius: 10px; outline: none; color: #2A332F; -webkit-appearance: none; background: white; }
.answer-input:focus { border-color: #D6C9E4; }
.answer-input.ok { border-color: #3E9B74; background: #E4F1EA; color: #276B4E; }
.answer-input.ng { border-color: #EFA9A5; background: #FADED9; color: #992F20; }
.ox-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.ox-label { background: white; border: 1px solid #E1E7E3; padding: 13px; border-radius: 10px; font-size: 17px; font-weight: 800; color: #6A716C; text-align: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.ox-label.active { background: #EDE4F4; border-color: #D6C9E4; color: #6B5B7B; }
.ox-label.ans, .opt-label.ans { background: #E4F1EA; border-color: #3E9B74; color: #276B4E; }
.ox-label.pick-ng, .opt-label.pick-ng { background: #FADED9; border-color: #EFA9A5; color: #992F20; }
.opt-label.ans .opt-num { color: #276B4E; }
.opt-label.pick-ng .opt-num { color: #992F20; }
.ox-tag { display: block; font-size: 10.5px; font-weight: 800; margin-top: 3px; letter-spacing: .2px; }
.opt-tag { float: right; margin-left: 8px; font-size: 10.5px; font-weight: 800; letter-spacing: .2px; }
@media (hover:hover) { .ox-label:hover:not(.active) { border-color: #D6C9E4; background: #FAF7FC; } }
.opt-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.opt-label { background: white; border: 1px solid #E1E7E3; padding: 11px 13px; border-radius: 10px; font-size: 13.5px; font-weight: 700; color: #2C2F2D; text-align: left; line-height: 1.6; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.opt-label.active { background: #EDE4F4; border-color: #D6C9E4; color: #6B5B7B; }
.opt-label.active .opt-num { color: #6B5B7B; }
@media (hover:hover) { .opt-label:hover:not(.active) { border-color: #D6C9E4; background: #FAF7FC; } }
.opt-label .opt-num { font-weight: 800; color: #6B5B7B; margin-right: 6px; }

/* 채점 결과(오답 확인) — 판정 한 줄 / 내 답·정답 줄 / 해설을 층으로 나눠 읽게 한다 */
.feedback { margin-top: 10px; padding: 11px 13px; border-radius: 10px; font-size: 12.5px; line-height: 1.7; display: none; }
.feedback.show { display: block; }
.feedback.correct { background: #EAF3ED; }
.feedback.wrong { background: #FBEEEB; }
.feedback b { font-weight: 800; }
.fb-top { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; }
.fb-mark { flex: 0 0 auto; width: 19px; height: 19px; border-radius: 50%; color: white; font-size: 12px; line-height: 19px; text-align: center; }
.feedback.correct .fb-top { color: #276B4E; }
.feedback.correct .fb-mark { background: #3E9B74; }
.feedback.wrong .fb-top { color: #A8402E; }
.feedback.wrong .fb-mark { background: #D9705E; }
.fb-rows { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
.fb-row { display: flex; gap: 9px; align-items: baseline; }
.fb-k { flex: 0 0 38px; font-size: 11px; font-weight: 800; color: #7B807C; }
.fb-v { flex: 1; font-weight: 800; color: #2C2F2D; word-break: break-word; }
.fb-v.mine { font-weight: 700; color: #8B6B64; }
.fb-v .alt { font-weight: 700; font-size: 11.5px; color: #7B807C; margin-left: 6px; }
.fb-why { margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(0,0,0,.08); font-size: 13px; line-height: 1.8; color: #3D453F; }
.fb-art { display: inline-block; margin-top: 7px; font-size: 11px; font-weight: 800; color: #6B5B7B; background: #EDE4F4; border-radius: 999px; padding: 4px 11px; }
.fb-lab { display: block; font-size: 11px; font-weight: 800; color: #7B807C; margin-bottom: 3px; }
.fb-chain + .fb-why { margin-top: 10px; }
.fb-chain { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
.fb-srow { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

<div class="hidden" id="app">

    <!-- 테스트 모드 -->

                <span class="si-txt" id="si-sum-text"></span>

            </div>

<script src="manifest.js"></script>

<script>
(function() {
    /* ===== 설정 ===== */
    // 문법 결과·배정을 담당하는 Apps Script 배포 주소 (apps-script/Code.gs)
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzikteq7gR2ezi_NXc2of8PTvUj5XouJ5ZcZOEWv0YWgjQjs8dZqogQjSr0-LSqneXF/exec';
    // 슈퍼스타 별 적립 — 결과를 수파베이스(gramma_results)에도 기록한다(리포트 저장소 027 마이그레이션).
    // 통과(70%)·세트 클리어(별 +1) 판정은 서버(029 gramma_submit)가 한다. 공개 키는 함수만 부를 수 있다.
    var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
    var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
    var PASS_PCT = window.STAGE ? STAGE.PASS_PCT : 70;   // 통과 기준(스테이지 규칙 — stage.js 한 곳)
    var GRADES = ['중1','중2','중3','고1','고2','고3'];

    function ic(inner, cls) { return '<svg class="' + (cls || 's-ic') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>'; }
    var IC = {
        send:  ic('<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>'),
        check: ic('<path d="M20 6L9 17l-5-5"/>'),
        alert: ic('<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>')
    };

    function $(id) { return document.getElementById(id); }
    function esc(s) { return ('' + (s == null ? '' : s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function normalize(s) {
        s = (s || '').replace(/\s/g, '').replace(/[,，、]/g, '').trim();
        var map = { '①':'1','②':'2','③':'3','④':'4','⑤':'5','⑥':'6','⑦':'7','⑧':'8','⑨':'9','⑩':'10' };
        return s.replace(/[①-⑩]/g, function(c) { return map[c] || c; });
    }
    // 과정형: 대괄호·공백 제거 (기존 음운 변동 페이지의 norm과 동일)
    function normForm(s) {
        // 옛 자모(초성·종성 U+1100~)로 들어온 낱자는 호환 자모(ㅂ U+3142 등)로 — 일부 휴대폰 키보드가 '-ㅂ시오'의 ㅂ을 다른 코드로 넣는다(2026-09-17)
        return jamoCompat(s || '').replace(/[\[\]\s]/g, '').replace(/[\u2010-\u2015\uFF0D\u2212]/g, '-').trim();
    }
    var JAMO_C = { 0x1100:'ㄱ',0x1101:'ㄲ',0x1102:'ㄴ',0x1103:'ㄷ',0x1104:'ㄸ',0x1105:'ㄹ',0x1106:'ㅁ',0x1107:'ㅂ',0x1108:'ㅃ',0x1109:'ㅅ',0x110A:'ㅆ',0x110B:'ㅇ',0x110C:'ㅈ',0x110D:'ㅉ',0x110E:'ㅊ',0x110F:'ㅋ',0x1110:'ㅌ',0x1111:'ㅍ',0x1112:'ㅎ',
        0x1161:'ㅏ',0x1162:'ㅐ',0x1163:'ㅑ',0x1164:'ㅒ',0x1165:'ㅓ',0x1166:'ㅔ',0x1167:'ㅕ',0x1168:'ㅖ',0x1169:'ㅗ',0x116A:'ㅘ',0x116B:'ㅙ',0x116C:'ㅚ',0x116D:'ㅛ',0x116E:'ㅜ',0x116F:'ㅝ',0x1170:'ㅞ',0x1171:'ㅟ',0x1172:'ㅠ',0x1173:'ㅡ',0x1174:'ㅢ',0x1175:'ㅣ',
        0x11A8:'ㄱ',0x11A9:'ㄲ',0x11AA:'ㄳ',0x11AB:'ㄴ',0x11AC:'ㄵ',0x11AD:'ㄶ',0x11AE:'ㄷ',0x11AF:'ㄹ',0x11B0:'ㄺ',0x11B1:'ㄻ',0x11B2:'ㄼ',0x11B3:'ㄽ',0x11B4:'ㄾ',0x11B5:'ㄿ',0x11B6:'ㅀ',0x11B7:'ㅁ',0x11B8:'ㅂ',0x11B9:'ㅄ',0x11BA:'ㅅ',0x11BB:'ㅆ',0x11BC:'ㅇ',0x11BD:'ㅈ',0x11BE:'ㅊ',0x11BF:'ㅋ',0x11C0:'ㅌ',0x11C1:'ㅍ',0x11C2:'ㅎ' };
    function jamoCompat(s) { return ('' + s).normalize('NFC').replace(/[\u1100-\u11FF]/g, function(c) { return JAMO_C[c.charCodeAt(0)] || c; }); }
    // "기어서/기여서"처럼 빗금으로 복수 표기된 형태는 어느 쪽을 써도 정답
    function formOK(user, form) {
        var bare = function(x) { return PUI.hyphenMarks ? x.replace(/^-+|-+$/g, '') : x; };   // 붙임표를 빈칸 옆에 보여 주는 파일은 형태소만 대조
        var u = bare(normForm(user));
        if (!u) return false;
        if (u === bare(normForm(form))) return true;
        var alts = ('' + form).split('/');
        if (alts.length < 2) return false;
        return alts.some(function(a) { return bare(normForm(a)) && bare(normForm(a)) === u; });
    }
    function circ(n) { var s = '①②③④⑤⑥⑦⑧⑨⑩'; n = parseInt(n, 10); return (n >= 1 && n <= 10) ? s.charAt(n - 1) : ('(' + n + ')'); }
    function pad2(n) { n = '' + n; return n.length < 2 ? '0' + n : n; }

    var params = new URLSearchParams(location.search);
    var catCode = params.get('c') || '';
    var round = params.get('r') || '';
    var preview = params.get('preview') === '1';   // 티쳐스 미리보기 — 배정 확인 생략
    var free = params.get('free') === '1';         // 자유 응시(index.html 전체 문법 테스트에서 옴) — 배정 확인 없이 제출, 결과·별은 그대로 기록

    var CAT_LABEL = '';
    if (window.GRAMMA && GRAMMA.categories) {
        GRAMMA.categories.forEach(function(x) { if (x.code === catCode) CAT_LABEL = x.label; });
    }

    function fail(msg) {
        var el = $('loading');
        el.className = 'loading-msg fail';
        el.innerHTML = IC.alert + msg;
    }

    if (!catCode || !round) { fail('주소가 올바르지 않습니다. (카테고리·회차 정보 없음)'); return; }

    /* ===== 데이터 로드 ===== */
    fetch('data/' + catCode + '-' + round + '.json', { cache: 'no-store' })
        .then(function(r) { if (!r.ok) throw new Error('not found'); return r.json(); })
        .then(function(data) { init(data); })
        .catch(function() { fail('아직 등록되지 않은 테스트입니다. (' + esc(CAT_LABEL || catCode) + ' ' + esc(round) + '회)'); });

    var DATA, QUESTIONS, TOTAL, RULES, submitted = false;

    function init(data) {
        DATA = data;
        QUESTIONS = data.questions || [];
        TOTAL = data.total || QUESTIONS.length;
        RULES = data.ruleOptions || [];
        RULES2 = data.ruleOptions2 || [];   // 둘째 드롭다운(형태소: 자립/의존) — 있으면 줄마다 두 가지를 고른다
        // 과정형 문구 — 기본은 음운 변동, 형태소 분석처럼 다른 용도면 data.processUI로 바꾼다
        PUI = Object.assign({ select: '— 변동 종류 —', select2: '— 구분 —', formFirst: false, mid: '바뀐 형태', last: '최종 발음', arrow: '→', sep: '→', chainTitle: '정답 과정', startLabel: '처음', brackets: true }, data.processUI || {});
        // 형태소 나누기처럼 학생이 몇 조각으로 나눌지 스스로 정해야 하는 파일은 processUI.freeSteps=true — 한 줄로 시작해 [+]로 늘리고 줄 수까지 채점한다
        FREE_STEPS = !!PUI.freeSteps; MAX_STEPS = PUI.maxSteps || 6;
        if (!CAT_LABEL) CAT_LABEL = data.category || catCode;

        $('h-title').textContent = data.title || '문법, 개념이 힘이다.';
        $('h-round').textContent = CAT_LABEL + ' ' + round + '회' + (data.subtitle ? ' · ' + data.subtitle : '');
        document.title = 'SHUEGUK 문법 ' + CAT_LABEL + ' ' + round + '회';
        $('total-count').textContent = TOTAL;

        var gradeSel = $('si-grade');
        gradeSel.innerHTML = '<option value="">선택</option>';
        GRADES.forEach(function(label) {
            var o = document.createElement('option');
            o.value = label; o.textContent = label;
            gradeSel.appendChild(o);
        });

        // 배정 확인 페이지(index.html)에서 넘어온 학생 정보로 미리 채움
        var pName = (params.get('name') || '').trim();
        var pSchool = (params.get('school') || '').trim();
        var pGrade = (params.get('grade') || '').trim();
        var pPhone8 = (params.get('p8') || '').replace(/[^0-9]/g, '').slice(0, 8);
        if (pName) $('si-name').value = pName;
        if (pSchool) $('si-school').value = pSchool;
        if (pGrade && GRADES.indexOf(pGrade) >= 0) gradeSel.value = pGrade;
        if (pPhone8.length === 8) $('si-phone8').value = pPhone8;
        $('si-phone8').addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8); });
        // 학생 정보 카드는 기본 접힘(요약 한 줄) — 카드를 누르면 펼쳐지고, [접기]로 다시 접는다 (2026-09-13 디자인 지시)
        ['si-name', 'si-school', 'si-grade', 'si-phone8'].forEach(function(id) {
            $(id).addEventListener('input', siSummary);
            $(id).addEventListener('change', siSummary);
        });
        siSummary();
        $('student-info').addEventListener('click', function(ev) {
            var card = $('student-info');
            if (card.classList.contains('collapsed')) { siOpen(true); return; }
            if (ev.target.closest('#si-sum')) siOpen(false);
        });

        buildStudy(data.study || {});
        buildQuestions();
        attachListeners();

        // 개념 카드가 없는 회차는 테스트 모드로 바로 시작
        if ($('study-section').classList.contains('hidden')) {
            $('mode-tabs').classList.add('hidden');
            setMode('test');
        }

        $('loading').classList.add('hidden');
        $('app').classList.remove('hidden');
    }

    /* ===== 학생 정보 요약/접기 ===== */
    function siSummary() {
        var name = ($('si-name').value || '').trim(), grade = $('si-grade').value || '', p8 = ($('si-phone8').value || '').trim();
        var parts = [
            name ? esc(name) : '<span class="miss">이름 미입력</span>',
            grade ? esc(grade) : '<span class="miss">학년 미선택</span>',
            /^[0-9]{8}$/.test(p8) ? esc(p8) : '<span class="miss">전화번호 8자리 미입력</span>'
        ];
        $('si-sum-text').innerHTML = parts.join(' · ');
    }
    function siOpen(open) {
        var card = $('student-info');
        card.classList.toggle('open', !!open);
        card.classList.toggle('collapsed', !open);
        $('si-edit').textContent = open ? '접기' : '수정';
    }

    /* ===== 개념 정리 ===== */
    // 용례를 '/' 단위 줄·쉼표 단위 낱말로 나눠 전부 칩으로 보여 준다 (2026-09-13 디자인 지시 — 큰 회색 상자 없이)
    function exHtml(ex) {
        if (!ex) return '';
        var chips = [];
        ('' + ex).split(' / ').forEach(function(line) {
            line.split(/,\s*/).forEach(function(t) { if (t.trim()) chips.push('<span class="ex-chip">' + esc(t.trim()) + '</span>'); });
        });
        return '<div class="vocab-example"><b>예</b><span class="ex-chips">' + chips.join('') + '</span></div>';
    }

    function buildStudy(study) {
        var tabsData = study.tabs || [];
        var tabs = $('cat-tabs'), body = $('study-body');
        if (!tabsData.length) {
            if (DATA.passage) { body.appendChild(passageEl(true)); return; }   // 지문형 회차 — 개념 정리 = 지문 전문
            $('study-section').classList.add('hidden'); return;
        }

        var cnt = document.createElement('span');
        cnt.className = 'cat-count'; cnt.id = 'cat-count';
        function ruleCount(idx) { return (tabsData[idx].items || []).filter(function(v) { return !v.note; }).length; }
        tabsData.forEach(function(d, idx) {
            var t = document.createElement('div');
            t.className = 'cat-label' + (idx === 0 ? ' active' : '');
            t.textContent = d.label;
            t.setAttribute('data-cat', idx);
            tabs.appendChild(t);

            var wrap = document.createElement('div');
            wrap.id = 'cat-' + idx;
            wrap.className = 'cat-content' + (idx === 0 ? '' : ' hidden');
            (d.items || []).forEach(function(v) {
                var c = document.createElement('div');
                if (v.note) {
                    c.className = 'note-box';
                    c.innerHTML = v.note; // 데이터 파일의 안내문(자체 제작 콘텐츠 — <b> 강조 허용)
                } else {
                    c.className = 'vocab-card';
                    c.innerHTML =
                        '<div class="vocab-word">' + esc(v.word) + (v.tag ? '<span class="vocab-tag">' + esc(v.tag) + '</span>' : '') + '</div>' +
                        '<div class="vocab-meaning">' + esc(v.meaning) + '</div>' +
                        exHtml(v.example);
                }
                wrap.appendChild(c);
            });
            body.appendChild(wrap);
        });
        tabs.appendChild(cnt);
        cnt.textContent = ruleCount(0) + '개 규칙';

        tabs.querySelectorAll('.cat-label').forEach(function(t) {
            t.addEventListener('click', function() {
                tabs.querySelectorAll('.cat-label').forEach(function(x) { x.classList.remove('active'); });
                t.classList.add('active');
                tabsData.forEach(function(_, idx) { $('cat-' + idx).classList.add('hidden'); });
                $('cat-' + t.getAttribute('data-cat')).classList.remove('hidden');
                cnt.textContent = ruleCount(parseInt(t.getAttribute('data-cat'), 10)) + '개 규칙';
            });
        });
    }

    /* ===== 문항 렌더링 ===== */
    function blankify(text) { return esc(text).replace(/___+/g, '<span class="blank">　　　</span>'); }
    function ruleOptionsHTML(list, ph) {
        list = list || RULES; ph = ph || PUI.select;
        var h = '<option value="">' + esc(ph) + '</option>';
        list.forEach(function(r) { h += '<option value="' + esc(r) + '">' + esc(r) + '</option>'; });
        return h;
    }
    // 선택지가 2~3개(실질/형식·자립/의존)면 드롭다운을 숨기고 알약 버튼으로 고른다 — 값은 select에 담긴다(채점·진행 카운트는 종전 그대로)
    var PILL_MAX = 3;
    function usePills(list) { return list.length > 0 && list.length <= PILL_MAX; }
    function selHTML(list, ph, id, cls) {
        var pills = usePills(list);
        var sel = '<select class="' + cls + (pills ? ' hid' : '') + '" id="' + id + '">' + ruleOptionsHTML(list, ph) + '</select>';
        if (!pills) return { sel: sel, pills: '' };
        var h = '<span class="pills" data-for="' + id + '"><span class="pl-lab">' + esc(ph) + '</span>';
        list.forEach(function(r) { h += '<button type="button" class="pill" data-v="' + esc(r).replace(/"/g, '&quot;') + '">' + esc(r) + '</button>'; });
        return { sel: sel, pills: h + '</span>' };
    }
    // 채점 뒤 알약에 정오 표시(select의 ok/ng·disabled를 따라간다)
    function pillSync(sel) {
        var g = sel && sel.closest('.step-row') ? sel.closest('.step-row').querySelector('.pills[data-for="' + sel.id + '"]') : null;
        if (!g) return;
        g.classList.toggle('ok', sel.classList.contains('ok'));
        g.classList.toggle('ng', sel.classList.contains('ng'));
        g.classList.toggle('none', !sel.value);
        g.classList.toggle('done', !!sel.disabled);
        g.querySelectorAll('.pill').forEach(function(b) { b.disabled = !!sel.disabled; b.classList.toggle('on', b.getAttribute('data-v') === sel.value); });
    }

    /* ===== 지문(조항 원문 + 해설) =====
       data.passage = { article:'제5항', chapter:'제3장 …', section:'된소리', text:'조항 원문', paras:['해설 문단', …] }
       테스트 모드에서는 문항 위에 원문만 펼치고 해설은 [해설 펼치기]로, 개념 정리 탭에서는 전부 펼친다. */
    function passageEl(open) {
        var ps = DATA.passage || {};
        var el = document.createElement('div');
        el.className = 'psg';
        var chap = [ps.chapter, ps.section].filter(Boolean).join(' · ');
        var h = (open ? '' : '<div class="psg-lbl">지문 — 조항과 해설을 읽고 O/X를 고르세요</div>') +
            '<div class="psg-head"><span class="psg-art">' + esc(ps.article || '') + '</span>' +
            (chap ? '<span class="psg-chap">' + esc(chap) + '</span>' : '') + '</div>' +
            (ps.text ? '<div class="psg-text">' + esc(ps.text) + '</div>' : '');
        var paras = ps.paras || [];
        if (paras.length) {
            // 문단은 문자열, 예시 표는 {ex:[줄, …]} — 표는 줄마다 한 줄(칸은 ' · ')
            h += '<div class="psg-body"' + (open ? '' : ' hidden') + '>' + paras.map(function(t) {
                if (t && t.ex) return '<div class="psg-ex">' + t.ex.map(function(r) { return '<span>' + esc(r) + '</span>'; }).join('') + '</div>';
                return '<p>' + esc(t) + '</p>';
            }).join('') + '</div>';
            if (!open) h += '<button type="button" class="psg-toggle">해설 펼치기' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>';
        }
        el.innerHTML = h;
        var tg = el.querySelector('.psg-toggle');
        if (tg) tg.addEventListener('click', function() {
            var body = el.querySelector('.psg-body');
            body.hidden = !body.hidden;
            tg.classList.toggle('open', !body.hidden);
            tg.firstChild.textContent = body.hidden ? '해설 펼치기' : '해설 접기';
        });
        return el;
    }
    /* 과정형 문항 — 정답 단계 수만큼 줄을 미리 만든다(몇 단계인지가 힌트 — 2026-09-13 사용자 "원래대로").
     * FREE_STEPS=true 로 두면 한 줄로 시작해 학생이 [+]로 늘린다(디자인 지시서의 + 버튼 방식). */
    var FREE_STEPS = false, MAX_STEPS = 6;
    var PUI = {}, RULES2 = [];
    function stepRowHTML(i, si, st) {
        var f0 = st ? ('' + st.form).split('/')[0] : '';
        var hyL = (PUI.hyphenMarks && /^-/.test(f0)) ? '<span class="hy">-</span>' : (PUI.hyphenMarks ? '<span class="hy off"></span>' : '');
        var hyR = (PUI.hyphenMarks && /-$/.test(f0)) ? '<span class="hy">-</span>' : (PUI.hyphenMarks ? '<span class="hy off"></span>' : '');
        var s1 = selHTML(RULES, PUI.select, 'sel-' + i + '-' + si, 'rule-select');
        var s2 = RULES2.length ? selHTML(RULES2, PUI.select2, 'sel2-' + i + '-' + si, 'rule-select sel2') : { sel: '', pills: '' };
        var sel = s1.sel + s2.sel + ((s1.pills || s2.pills) ? '<span class="pillset">' + s1.pills + s2.pills + '</span>' : '');
        var inp = hyL + '<input type="text" class="form-input" id="frm-' + i + '-' + si + '" autocomplete="off" autocorrect="off" autocapitalize="off">' + hyR;
        var sep = '<span class="step-arrow">' + esc(PUI.sep) + '</span>';
        return '<div class="step-row' + (RULES2.length ? ' two' : '') + '" data-i="' + i + '">' +
            '<span class="step-arrow">' + esc(PUI.arrow) + '</span>' +
            (PUI.formFirst ? inp + sep + sel : sel + sep + inp) +
            (FREE_STEPS ? '<button type="button" class="step-del" aria-label="단계 빼기" hidden>×</button>' : '') +
            '</div>';
    }
    // 줄 번호·placeholder·빼기 버튼을 다시 매긴다 (마지막 줄 = 최종 발음)
    function relabelSteps(i) {
        var rows = $('card-' + i).querySelectorAll('.step-row');
        rows.forEach(function(r, si) {
            r.querySelector('.rule-select').id = 'sel-' + i + '-' + si;
            var s2 = r.querySelector('.sel2'); if (s2) s2.id = 'sel2-' + i + '-' + si;
            var hidSels = r.querySelectorAll('.rule-select.hid'), gs = r.querySelectorAll('.pills');   // 알약은 숨긴 select와 같은 순서
            gs.forEach(function(g, k) { if (hidSels[k]) g.setAttribute('data-for', hidSels[k].id); });
            var inp = r.querySelector('.form-input');
            inp.id = 'frm-' + i + '-' + si;
            inp.placeholder = (si === rows.length - 1) ? PUI.last : PUI.mid;
            var del = r.querySelector('.step-del');
            if (del) del.hidden = !(FREE_STEPS && rows.length > 1 && si === rows.length - 1);
        });
        var add = $('card-' + i).querySelector('.step-add');
        if (add) add.disabled = rows.length >= MAX_STEPS;
    }
    function addStep(i) {
        var box = $('card-' + i).querySelector('.q-steps');
        if (box.querySelectorAll('.step-row').length >= MAX_STEPS) return;
        box.insertAdjacentHTML('beforeend', stepRowHTML(i, box.querySelectorAll('.step-row').length));
        relabelSteps(i);
        var last = box.lastElementChild.querySelector('.rule-select');
        if (last) last.focus();
        updateProgress();
    }
    function removeStep(i, row) {
        var box = $('card-' + i).querySelector('.q-steps');
        if (box.querySelectorAll('.step-row').length <= 1) return;
        row.remove();
        relabelSteps(i);
        updateProgress();
    }
    function stepRows(i) { return $('card-' + i).querySelectorAll('.step-row'); }

    function buildQuestions() {
        var box = $('questions');
        if (DATA.passage) box.appendChild(passageEl(false));
        if (DATA.instruction) {
            var il = document.createElement('div');
            il.className = 'section-label';
            // 데이터 파일의 지시문(자체 제작 콘텐츠 — <b> 강조 허용). '(대괄호 없이 한글만)'은 흐리게.
            il.innerHTML = ic('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>') +
                '<span>' + DATA.instruction.replace(/\(대괄호 없이 한글만\)/, '<span class="dim">(대괄호 없이 한글만)</span>') + '</span>';
            box.appendChild(il);
        }
        QUESTIONS.forEach(function(q, i) {
            if (q.section) {
                var sl = document.createElement('div');
                sl.className = 'section-label';
                sl.textContent = q.section;
                box.appendChild(sl);
            }
            if (q.boxki && q.boxki.length) {
                var bk = document.createElement('div');
                bk.className = 'boxki';
                bk.innerHTML = '<b>&lt;보기&gt;</b><div class="boxki-words">' +
                    q.boxki.map(function(w) { return '<span class="boxki-word">' + esc(w) + '</span>'; }).join('') + '</div>';
                box.appendChild(bk);
            }
            var card = document.createElement('div');
            card.className = 'q-card';
            card.id = 'card-' + i;
            if (q.type === 'process') {
                var nRows = FREE_STEPS ? 1 : (q.steps || []).length;
                var rows = '';
                for (var si = 0; si < nRows; si++) rows += stepRowHTML(i, si, (q.steps || [])[si]);
                var h = '<div class="q-line">' +
                    '<span class="q-id"><span class="q-num">' + esc(pad2(q.num)) + '</span><i class="q-bar"></i></span>' +
                    '<span class="q-start">' + esc(q.start) + '</span>' +
                    '<span class="q-steps">' + rows + '</span>' +
                    (FREE_STEPS ? '<button type="button" class="step-add" data-i="' + i + '" aria-label="단계 추가">+</button>' : '') +
                    '</div>';
                if (q.hint) h += '<div class="q-hint"><b>힌트</b>' + esc(q.hint) + '</div>';
                card.innerHTML = h + '<div class="feedback" id="feedback-' + i + '"></div>';
                box.appendChild(card);
                relabelSteps(i);
                return;
            } else {
                var head = '<div><span class="q-num">' + esc(pad2(q.num)) + '</span>' +
                    (q.chosung ? '<span class="chosung">' + esc(q.chosung) + '</span>' : '') + '</div>' +
                    '<div class="q-stem">' + esc(q.stem) + '</div>' +
                    (q.example ? '<div class="q-example">' + blankify(q.example) + '</div>' : '') +
                    (q.hint ? '<div class="q-hint"><b>힌트</b>' + esc(q.hint) + '</div>' : '');
                if (q.type === 'ox') {
                    card.innerHTML = head +
                        '<div class="ox-buttons">' +
                        '<div class="ox-label" data-ox="O" data-i="' + i + '">O</div>' +
                        '<div class="ox-label" data-ox="X" data-i="' + i + '">X</div></div>' +
                        '<div class="feedback" id="feedback-' + i + '"></div>';
                } else if (q.type === 'choice') {
                    var opts = (q.options || []).map(function(opt, oi) {
                        return '<div class="opt-label" data-opt="' + (oi + 1) + '" data-i="' + i + '"><span class="opt-num">' + circ(oi + 1) + '</span>' + esc(opt) + '</div>';
                    }).join('');
                    card.innerHTML = head + '<div class="opt-buttons">' + opts + '</div>' +
                        '<div class="feedback" id="feedback-' + i + '"></div>';
                } else {
                    card.innerHTML = head +
                        '<input type="text" class="answer-input" id="input-' + i + '" placeholder="답을 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="off">' +
                        '<div class="feedback" id="feedback-' + i + '"></div>';
                }
            }
            box.appendChild(card);
        });
    }

    /* ===== 진행/입력 ===== */
    var oxChoice = {}, choiceSel = {};
    function itemFilled(q, i) {
        if (q.type === 'process') {
            var rows = stepRows(i);
            if (!rows.length) return false;
            for (var si = 0; si < rows.length; si++) {
                if (!$('sel-' + i + '-' + si).value) return false;
                if (RULES2.length && !$('sel2-' + i + '-' + si).value) return false;
                if (!$('frm-' + i + '-' + si).value.trim()) return false;
            }
            return true;
        }
        if (q.type === 'ox') return !!oxChoice[i];
        if (q.type === 'choice') return !!choiceSel[i];
        var inp = $('input-' + i);
        return !!(inp && inp.value.trim());
    }
    function updateProgress() {
        var filled = 0;
        QUESTIONS.forEach(function(q, i) {
            var f = itemFilled(q, i);
            if (f) filled++;
            if (!submitted) $('card-' + i).classList.toggle('filled', f);
            if (q.type === 'process') stepRows(i).forEach(function(r) { var inp = r.querySelector('.form-input'); inp.classList.toggle('has', !!inp.value.trim()); });
        });
        $('filled-count').textContent = filled;
        $('pfill').style.width = (TOTAL ? Math.round(filled / TOTAL * 100) : 0) + '%';
        $('submit-btn').classList.toggle('ready', TOTAL > 0 && filled === TOTAL);
    }

    function attachListeners() {
        QUESTIONS.forEach(function(q, i) {
            if (q.type === 'ox') {
                $('card-' + i).querySelectorAll('.ox-label').forEach(function(b) {
                    b.addEventListener('click', function() {
                        if (submitted) return;
                        oxChoice[i] = b.getAttribute('data-ox');
                        $('card-' + i).querySelectorAll('.ox-label').forEach(function(x) { x.classList.remove('active'); });
                        b.classList.add('active');
                        updateProgress();
                    });
                });
            } else if (q.type === 'choice') {
                $('card-' + i).querySelectorAll('.opt-label').forEach(function(b) {
                    b.addEventListener('click', function() {
                        if (submitted) return;
                        choiceSel[i] = b.getAttribute('data-opt');
                        $('card-' + i).querySelectorAll('.opt-label').forEach(function(x) { x.classList.remove('active'); });
                        b.classList.add('active');
                        updateProgress();
                    });
                });
            }
        });
        var qbox = $('questions');
        qbox.addEventListener('input', updateProgress);
        qbox.addEventListener('change', updateProgress);
        qbox.addEventListener('click', function(ev) {
            var b = ev.target.closest('.pill');
            if (!b || submitted) return;
            var g = b.closest('.pills'), sel = $(g.getAttribute('data-for'));
            if (!sel || sel.disabled) return;
            sel.value = (sel.value === b.getAttribute('data-v')) ? '' : b.getAttribute('data-v');   // 같은 것을 다시 누르면 해제
            g.querySelectorAll('.pill').forEach(function(x) { x.classList.toggle('on', x.getAttribute('data-v') === sel.value); });
            sel.dispatchEvent(new Event('change', { bubbles: true }));
        });
        qbox.addEventListener('click', function(ev) {
            if (submitted) return;
            var add = ev.target.closest('.step-add');
            if (add) { addStep(parseInt(add.getAttribute('data-i'), 10)); return; }
            var del = ev.target.closest('.step-del');
            if (del) { var row = del.closest('.step-row'); removeStep(parseInt(row.getAttribute('data-i'), 10), row); }
        });
        $('tab-study').addEventListener('click', function() { setMode('study'); });
        $('tab-test').addEventListener('click', function() { setMode('test'); });
        $('submit-btn').addEventListener('click', submit);
    }

    function setMode(m) {
        var study = m === 'study';
        $('tab-study').classList.toggle('active', study);
        $('tab-test').classList.toggle('active', !study);
        $('study-section').classList.toggle('hidden', !study);
        $('test-section').classList.toggle('hidden', study);
        $('tb-row2').classList.toggle('hidden', study);
    }

    /* ===== 채점/제출 ===== */
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function nowStr() {
        var d = new Date();
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function correctChain(q) {
        var s = q.start;
        (q.steps || []).forEach(function(st, si) {
            var label = st.accept.join('/') + (st.accept2 ? '·' + st.accept2.join('/') : '');
            var f = (si === q.steps.length - 1 && PUI.brackets) ? '[' + dispForm(st.form) + ']' : dispForm(st.form);
            s += ' ' + PUI.arrow + ' ' + (PUI.formFirst ? f + ' (' + label + ')' : '(' + label + ') ' + PUI.sep + ' ' + f);
        });
        return s;
    }

    /* ===== 오답 확인 화면 조각 =====
     * 판정 한 줄 → 내 답·정답 줄 → 해설 순으로 층을 나눠, 한 문단에 몰아넣지 않는다. */
    function fbTop(ok, label) {
        return '<div class="fb-top"><span class="fb-mark">' + (ok ? '✓' : '✗') + '</span>' + esc(label) + '</div>';
    }
    function fbRow(k, valueHtml, cls) {
        return '<div class="fb-row"><span class="fb-k">' + esc(k) + '</span>' +
               '<span class="fb-v' + (cls ? ' ' + cls : '') + '">' + valueHtml + '</span></div>';
    }
    function fbRows(html) { return html ? '<div class="fb-rows">' + html + '</div>' : ''; }
    /* 해설에서 근거 조항('제5항', '제10항 붙임 1')을 떼어 칩으로 보여 준다.
     * 맞춤법(ort) 해설은 조항만 적힌 것이 절반이 넘어, 문장과 조항을 섞어 두면 읽기 어렵다. */
    var ART = '제\\s*\\d+\\s*항(?:\\s*붙임(?:\\s*\\d+)?)?(?:\\s*다만(?:\\s*\\d+)?)?';
    function splitWhy(text) {
        var t = ('' + (text == null ? '' : text)).trim();
        if (!t) return { body: '', art: '' };
        var m = t.match(new RegExp('^(.*\\S)\\s*[(（]\\s*(' + ART + ')\\s*[)）]\\s*[.。]?$'));
        if (m) return { body: m[1].replace(/[,\s]+$/, ''), art: m[2] };
        m = t.match(new RegExp('^(' + ART + ')\\s*[.。]?$'));
        if (m) return { body: '', art: m[1] };
        m = t.match(new RegExp('^(' + ART + ')\\s*[—–-]\\s*(\\S.*)$'));
        if (m) return { body: m[2], art: m[1] };
        return { body: t, art: '' };
    }
    function fbWhy(text) {
        var w = splitWhy(text);
        if (!w.body && !w.art) return '';
        return '<div class="fb-why"><b class="fb-lab">' + (w.body ? '해설' : '근거 규정') + '</b>' +
               (w.body ? esc(w.body) : '') +
               (w.art ? '<div><span class="fb-art">' + esc(w.art) + '</span></div>' : '') + '</div>';
    }
    // 채점 뒤 보기 줄에 정답·내 답을 직접 표시한다 (해설을 읽기 전에 눈으로 먼저 보이도록)
    function markPick(el, kind) {
        el.classList.remove('active');
        el.classList.add(kind === 'ans' ? 'ans' : 'pick-ng');
        el.insertAdjacentHTML('beforeend',
            '<span class="' + (el.classList.contains('ox-label') ? 'ox-tag' : 'opt-tag') + '">' +
            (kind === 'ans' ? '정답' : '내 답') + '</span>');
    }
    // 음운 변동 과정 — 문항의 입력 줄과 같은 순서로, 단계마다 한 줄씩 보여 준다
    // 정답 표시용 형태 — processUI.firstForm이면 빗금 목록의 첫 표기만(형태소: '믿-/믿/-믿/-믿-' → '믿-'), 음운은 '기어서/기여서'처럼 둘 다 보여 준다
    function dispForm(form) { return PUI.firstForm ? ('' + form).split('/')[0] : form; }
    function chainHTML(q) {
        var h = '<b class="fb-lab">' + esc(PUI.chainTitle) + '</b><div class="fb-chain">' +
                '<div class="fb-srow"><span class="fb-sn">' + esc(PUI.startLabel) + '</span><span class="ch-f">' + esc(q.start) + '</span></div>';
        (q.steps || []).forEach(function(st, si) {
            var fin = (si === q.steps.length - 1);
            var rule = '<span class="ch-r">' + esc(st.accept.join(' 또는 ')) + '</span>' +
                 (st.accept2 ? '<span class="ch-r">' + esc(st.accept2.join(' 또는 ')) + '</span>' : '');
            var formEl = '<span class="ch-f' + (fin ? ' fin' : '') + '">' + esc((fin && PUI.brackets) ? '[' + dispForm(st.form) + ']' : dispForm(st.form)) + '</span>';
            var arEl = '<span class="ch-ar">' + esc(PUI.sep) + '</span>';
            h += '<div class="fb-srow"><span class="fb-sn">' + (si + 1) + '</span>' +
                 (PUI.formFirst ? formEl + arEl + rule : rule + arEl + formEl) + '</div>';
        });
        return h + '</div>';
    }
    // 단답의 다른 정답 표기
    function altHTML(q) {
        var accept = (q.answers && q.answers.length) ? q.answers : [];
        var others = accept.filter(function(a) { return normalize(a) !== normalize(q.answer); });
        return others.length ? '<span class="alt">' + esc(others.join(' · ')) + ' 도 정답</span>' : '';
    }

    function submit() {
        if (submitted) return;
        var sName = ($('si-name').value || '').trim();
        var sSchool = ($('si-school').value || '').trim();
        var sGrade = $('si-grade').value || '';
        var sPhone8 = ($('si-phone8').value || '').trim();
        if (!sName || !sSchool || !sGrade || !/^[0-9]{8}$/.test(sPhone8)) {
            siOpen(true);
            alert('제출 전에 이름·학교·학년·학부모님 휴대전화번호 8자리를 모두 입력해 주세요!');
            $('si-name').scrollIntoView({ block: 'center' });
            return;
        }
        if (preview || free) { doSubmit(sName, sSchool, sGrade); return; }
        /* 제출 시점에 배정 확인(선생님이 보낸 링크·배정 목록에서 온 경우) — 선생님이 학년·학교·개인에게 배정한 테스트만 제출을 받는다.
         * 확인 자체가 실패하면(순간 장애·배정 기능 미배포) 시험은 받아준다(어휘의 열린 주차 확인과 같은 방침). */
        var btn = $('submit-btn');
        btn.disabled = true; btn.textContent = '확인 중…';
        fetch(SCRIPT_URL + '?action=myAssign&grade=' + encodeURIComponent(sGrade) + '&school=' + encodeURIComponent(sSchool) + '&name=' + encodeURIComponent(sName) + '&t=' + Date.now(), { cache: 'no-store' })
            .then(function(r) { return r.json(); })
            .then(function(st) {
                if (st && st.ok === true && st.kind === 'assign') {
                    var hit = (st.items || []).some(function(a) { return '' + a.cat === '' + catCode && '' + a.round === '' + round; });
                    if (!hit) {
                        btn.disabled = false; btn.textContent = '전체 제출';
                        alert('지금 나에게 배정된 테스트가 아니에요.\n배정 확인 페이지에서 내 테스트를 다시 확인해 주세요.');
                        return;
                    }
                }
                doSubmit(sName, sSchool, sGrade);
            })
            .catch(function() { doSubmit(sName, sSchool, sGrade); });
    }

    function doSubmit(sName, sSchool, sGrade) {
        if (submitted) return;
        submitted = true;
        var score = 0, details = [], wrongIdx = [];

        QUESTIONS.forEach(function(q, i) {
            var card = $('card-' + i), fb = $('feedback-' + i), qNum = q.num;
            var isCorrect = false;
            if (q.type === 'process') {
                // 학생이 만든 줄 수와 정답 단계 수가 같고 줄마다 규칙·형태가 맞아야 정답. 남는 줄은 오답, 모자란 단계는 정답 과정에서 보인다.
                var rows = stepRows(i), itemOK = rows.length === q.steps.length;
                rows.forEach(function(r, si) {
                    var sel = $('sel-' + i + '-' + si), frm = $('frm-' + i + '-' + si), st = q.steps[si], sel2 = $('sel2-' + i + '-' + si);
                    var ruleOK = !!st && st.accept.indexOf(sel.value) >= 0;
                    var rule2OK = !sel2 || (!!st && (st.accept2 || []).indexOf(sel2.value) >= 0);
                    var fOK = !!st && formOK(frm.value, st.form);
                    var hid1 = sel.classList.contains('hid'), hid2 = sel2 && sel2.classList.contains('hid');
                    sel.className = 'rule-select ' + (hid1 ? 'hid ' : '') + (ruleOK ? 'ok' : 'ng');
                    if (sel2) { sel2.className = 'rule-select sel2 ' + (hid2 ? 'hid ' : '') + (rule2OK ? 'ok' : 'ng'); sel2.disabled = true; }
                    frm.className = 'form-input ' + (fOK ? 'ok' : 'ng');
                    sel.disabled = true; frm.disabled = true;
                    pillSync(sel); if (sel2) pillSync(sel2);
                    if (!(ruleOK && rule2OK && fOK)) itemOK = false;
                });
                card.querySelectorAll('.step-add, .step-del').forEach(function(b) { b.remove(); });
                isCorrect = itemOK;
                fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
                if (isCorrect) {
                    fb.innerHTML = fbTop(true, '정답') + fbWhy(q.explanation);
                    details.push(qNum + '. ✓');
                } else {
                    fb.innerHTML = fbTop(false, '다시 확인해요') + chainHTML(q) + fbWhy(q.explanation);
                    details.push(qNum + '. ✗ → ' + correctChain(q));
                }
            } else if (q.type === 'ox') {
                var choice = oxChoice[i] || null;
                isCorrect = (choice === q.answer);
                card.querySelectorAll('.ox-label').forEach(function(x) {
                    x.style.pointerEvents = 'none';
                    var v = x.getAttribute('data-ox');
                    if (v === q.answer) markPick(x, 'ans');
                    else if (v === choice) markPick(x, 'ng');
                    else x.classList.remove('active');
                });
                fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
                fb.innerHTML = fbTop(isCorrect, isCorrect ? '정답' : '다시 확인해요') +
                    fbRows((isCorrect ? '' : fbRow('내 답', choice ? esc(choice) : '미선택', 'mine')) +
                           fbRow('정답', esc(q.answer))) +
                    fbWhy(q.explanation);
                details.push(qNum + '. ' + (isCorrect ? '✓ ' : '✗ ') + (choice || '(미선택)') + (isCorrect ? '' : ' → 정답: ' + q.answer));
            } else if (q.type === 'choice') {
                var sel2 = choiceSel[i] || null;
                isCorrect = (sel2 === ('' + q.answer));
                card.querySelectorAll('.opt-label').forEach(function(x) {
                    x.style.pointerEvents = 'none';
                    var v = x.getAttribute('data-opt');
                    if (v === ('' + q.answer)) markPick(x, 'ans');
                    else if (v === sel2) markPick(x, 'ng');
                    else x.classList.remove('active');
                });
                fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
                var ansText = (q.options && q.options[parseInt(q.answer, 10) - 1]) || '';
                fb.innerHTML = fbTop(isCorrect, isCorrect ? '정답' : '다시 확인해요') +
                    fbRows((isCorrect ? '' : fbRow('내 답', sel2 ? circ(sel2) + ' ' + esc((q.options || [])[parseInt(sel2, 10) - 1] || '') : '미선택', 'mine')) +
                           fbRow('정답', circ(q.answer) + (ansText ? ' ' + esc(ansText) : ''))) +
                    fbWhy(q.explanation);
                details.push(qNum + '. ' + (isCorrect ? '✓ ' : '✗ ') + (sel2 ? circ(sel2) : '(미선택)') + (isCorrect ? '' : ' → 정답: ' + circ(q.answer)));
            } else {
                var inp = $('input-' + i);
                var user = normalize(inp.value);
                var accept = (q.answers && q.answers.length) ? q.answers : [q.answer];
                isCorrect = !!user && accept.some(function(a) { return normalize(a) === user; });
                if (!isCorrect && q.contains && user.indexOf(normalize(q.contains)) !== -1) isCorrect = true;
                if (!isCorrect && user) {
                    isCorrect = accept.some(function(a) {
                        var groups = ('' + (a == null ? '' : a)).split(/[,，]/).map(normalize).filter(function(g) { return g; });
                        if (groups.length < 2) return false;
                        return groups.every(function(g) { return user.indexOf(g) !== -1; });
                    });
                }
                inp.disabled = true;
                inp.className = 'answer-input ' + (isCorrect ? 'ok' : 'ng');
                fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
                if (isCorrect) {
                    fb.innerHTML = fbTop(true, '정답') +
                        fbRows(fbRow('정답', esc(q.answer) + altHTML(q))) + fbWhy(q.explanation);
                    details.push(qNum + '. ✓ ' + inp.value);
                } else {
                    fb.innerHTML = fbTop(false, '다시 확인해요') +
                        fbRows(fbRow('내 답', inp.value.trim() ? esc(inp.value) : '미입력', 'mine') +
                               fbRow('정답', esc(q.answer) + altHTML(q))) +
                        fbWhy(q.explanation);
                    details.push(qNum + '. ✗ ' + (inp.value || '(미입력)') + ' → 정답: ' + q.answer);
                }
            }
            card.className = 'q-card ' + (isCorrect ? 'correct' : 'wrong');
            if (isCorrect) score++; else wrongIdx.push(i);
            fb.innerHTML += '<div style="margin-top:6px;">' + GRAMMA_REPORT.linkHTML(String(i + 1), '이 문항 오류 제보') + '</div>';   // 오류 제보(report.js)
        });
        window.GRAMMA_REPORT = window.GRAMMA_REPORT || {};
        GRAMMA_REPORT.info = function(key) {
            var i = parseInt(key, 10) - 1, q = QUESTIONS[i]; if (!q) return null;
            var lv = ''; if (window.GRAMMA) GRAMMA.categories.forEach(function(x) { if (x.code === catCode) lv = x.level || ''; });
            var ans = q.type === 'process' ? correctChain(q) : q.type === 'choice' ? String(q.answer) + '번' : String(q.answer == null ? '' : q.answer);
            return { cat: CAT_LABEL, level: lv, round: round, qno: q.num || (i + 1), start: q.type === 'process' ? q.start : (q.stem || ''), mine: '', answer: ans, preview: preview,
                     who: { name: ($('si-name').value || '').trim(), school: ($('si-school').value || '').trim(), grade: $('si-grade').value || '' } };
        };

        var pct = Math.round((score / TOTAL) * 100), msg;
        var starHtml = preview ? '' :
            (pct >= PASS_PCT
                ? '<div class="star-box on" id="star-box">정답률 <b>' + pct + '%</b> · 스테이지 <b>통과</b>!<span class="sub" id="star-sub">기록하는 중…</span></div>'
                : '<div class="star-box" id="star-box">정답률 <b>' + pct + '%</b> · ' + PASS_PCT + '% 이상이면 스테이지 통과 (세트를 다 통과하면 별 +1)<span class="sub" id="star-sub"></span></div>');
        if (pct === 100) msg = '완벽해요! ' + CAT_LABEL + ' ' + round + '회 완전 정복입니다';
        else if (pct >= 80) msg = '훌륭해요! 틀린 문항만 다시 짚어 봐요.';
        else if (pct >= 60) msg = '잘 풀었어요. 오답을 중심으로 복습해 봐요.';
        else if (pct >= 40) msg = '개념 정리 탭으로 돌아가 개념을 다시 확인해 볼까요?';
        else msg = '괜찮아요. 개념 정리부터 천천히 다시 익혀 봐요.';

        var finalEl = $('final');
        finalEl.innerHTML =
            '<div><span class="score-big">' + score + '</span><span class="total"> / ' + TOTAL + '</span></div>' +
            '<div class="msg">' + msg + '</div>' + starHtml +
            (wrongIdx.length ? '<button type="button" class="review-btn" id="review-btn">틀린 ' + wrongIdx.length + '문항만 보기</button><br>' : '') +
            '<div id="send-status" class="send-status-box sending">' + IC.send + '선생님께 결과 전송 중…</div>' +
            '<button type="button" id="retry-btn" class="send-btn" style="display:none;">다시 전송하기</button>' +
            '<br><button type="button" class="send-btn reset" onclick="location.reload()">처음부터 다시</button>';
        finalEl.className = 'final show';

        var payload = {
            time: nowStr(), name: sName, school: sSchool, grade: sGrade,
            phone8: ($('si-phone8').value || '').trim(),
            unit: CAT_LABEL, round: round, score: score + ' / ' + TOTAL, details: details.join('\n')
        };
        sendResult(payload);
        if (!preview) sendStar(payload, score, TOTAL);
        var retryBtn = $('retry-btn');
        if (retryBtn) retryBtn.addEventListener('click', function() { sendResult(payload); });

        // 오답만 모아 보기 — 문항이 많아도 틀린 것만 훑을 수 있게
        var reviewBtn = $('review-btn');
        if (reviewBtn) reviewBtn.addEventListener('click', function() {
            var on = document.body.classList.toggle('only-wrong');
            reviewBtn.textContent = on ? '전체 문항 보기' : '틀린 ' + wrongIdx.length + '문항만 보기';
            if (on) $('card-' + wrongIdx[0]).scrollIntoView({ block: 'center' });
        });

        $('result-display').textContent = '맞힌 문항: ' + score + ' / ' + TOTAL;
        $('submit-btn').hidden = true;
        setTimeout(function() { finalEl.scrollIntoView({ block: 'center' }); }, 300);
    }

    // 수파베이스 기록 — 실패해도 시트 기록(sendResult)은 이미 갔으므로 화면 안내만
    // 수파베이스 기록(029 gramma_submit) — 통과(70%)·세트 클리어(별 +1) 판정은 서버가 한다. 세트 구성은 stage.js가 정한다.
    function sendStar(payload, got, total) {
        var set = window.STAGE ? STAGE.setOf(catCode, round) : null;
        var body = { time: payload.time, name: payload.name, school: payload.school, grade: payload.grade, phone8: payload.phone8,
                     unit: payload.unit, round: '' + payload.round, score: payload.score, got: got, total: total, details: payload.details,
                     mode: 'test', points: 0, set: set ? { no: set.no, rounds: set.rounds.map(String) } : null };
        var sub = $('star-sub');
        function say(t) { if (sub) sub.textContent = t; }
        fetch(SB_URL + '/rest/v1/rpc/gramma_submit', {
            method: 'POST', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p: body })
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res || res.ok !== true) { say('기록에 실패했어요 — 선생님께 말씀해 주세요.'); return; }
            if (res.set_cleared && set) say(res.set_first ? '세트 ' + set.no + ' 클리어 · 슈퍼스타 별 +1! 내 별에 더해졌어요(문법 별 ' + res.stars + '개).' : '세트 ' + set.no + '은 이미 클리어했어요(세트마다 별 한 번). 문법 별 ' + res.stars + '개.');
            else if (res.pass && set) say('세트 ' + set.no + '(스테이지 ' + set.rounds[0] + '~' + set.rounds[set.rounds.length - 1] + ')을 모두 통과하면 별 +1. 문법 별 ' + (res.stars || 0) + '개.');
            else if (res.pass) say('기록됐어요.');
        }).catch(function() { say('기록에 실패했어요 — 선생님께 말씀해 주세요.'); });
    }

    function sendResult(payload) {
        var box = $('send-status'), retryBtn = $('retry-btn');
        if (box) { box.className = 'send-status-box sending'; box.innerHTML = IC.send + '선생님께 결과 전송 중…'; }
        if (retryBtn) retryBtn.style.display = 'none';
        fetch(SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        }).then(function() {
            if (box) { box.className = 'send-status-box done'; box.innerHTML = IC.check + '선생님께 결과가 전송되었어요!'; }
        }).catch(function() {
            if (box) { box.className = 'send-status-box fail'; box.innerHTML = IC.alert + '전송에 실패했어요. 인터넷 확인 후 아래 버튼을 눌러주세요.'; }
            if (retryBtn) retryBtn.style.display = 'inline-block';
        });
    }
})();
</script>
</body>
</html>
