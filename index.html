<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUEGUK 문법 테스트</title>
<meta name="description" content="이수경국어 문법 테스트 — 단원·레벨·회차를 골라 응시, 배정된 테스트 확인" />
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Do+Hyeon&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif; background: #C6D5D2; min-height: 100vh; padding: 14px; padding-bottom: 60px; color: #2A332F; -webkit-text-size-adjust: 100%; }
.container { max-width: 580px; margin: 0 auto; }

/* ===== 히어로 카드 (2026-09-16 디자인 지시서) ===== */
.header { background: #fff; border-radius: 18px; padding: 20px 22px; display: flex; align-items: center; gap: 20px; margin-bottom: 12px; }
.header .h-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; text-align: left; }
.header .logo { font-size: 10.5px; font-weight: 400; color: #8B978F; letter-spacing: .24em; }
.header h1 { font-family: 'Gowun Batang', serif; font-size: 22px; font-weight: 700; color: #2A332F; letter-spacing: -0.5px; line-height: 1.3; }
.header .intro { font-size: 12.5px; color: #4F5C56; line-height: 1.6; }
.header .h-right { flex: none; display: flex; flex-direction: column; align-items: center; gap: 7px; }
.header .bigstar { width: 76px; height: 76px; display: block; }
.header .bigstar path { fill: #F2F5F3; stroke: #E2E8E4; stroke-width: 1; stroke-linejoin: round; }
.header .bigstar.on path { fill: #FFC21F; stroke: #FFC21F; }
.header .mystars { font-size: 11.5px; font-weight: 700; color: #5C6A64; }
.pill-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 13px; border-radius: 999px; background: #EDE4F4; color: #5A4A6A; font: inherit; font-size: 11px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.pill-btn:hover { background: #E3D7EE; } .pill-btn:active { background: #D9CAE7; }
@media (max-width: 400px) { .header { padding: 18px 16px; gap: 14px; } .header .bigstar { width: 60px; height: 60px; } }

/* ===== 학생 정보 — 이미 입력한 학생은 요약 한 줄 ===== */
.student-info { background: #fff; border-radius: 18px; padding: 15px 18px; margin-bottom: 10px; }
.si-sum { display: none; align-items: center; gap: 14px; }
.student-info.collapsed .si-sum { display: flex; }
.student-info.collapsed .si-body { display: none; }
.si-sum img { width: 44px; height: 44px; object-fit: contain; flex: none; }
.si-sum img.none { visibility: hidden; }
.si-sum .si-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.si-sum .si-nm { font-size: 13px; font-weight: 700; color: #2A332F; }
.si-sum .si-sub { font-size: 11.5px; line-height: 1.5; color: #4F5C56; }
.si-sum .si-go { flex: none; padding: 10px 16px; border-radius: 999px; background: #EDE4F4; color: #5A4A6A; font: inherit; font-size: 12.5px; font-weight: 700; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.si-sum .si-go:hover { background: #E3D7EE; } .si-sum .si-go:active { background: #D9CAE7; }
.si-edit { flex: none; font: inherit; font-size: 11.5px; color: #5C6A64; background: none; border: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.student-info .si-title { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: #2A332F; margin-bottom: 10px; }
.si-row { display: flex; gap: 8px; margin-bottom: 8px; }
.si-field { flex: 1; }
.si-field.small { flex: 0 0 92px; }
.si-field label { display: block; font-size: 11px; font-weight: 700; color: #5C6A64; margin-bottom: 3px; }
.si-field input, .si-field select { width: 100%; padding: 10px; font-size: 14px; font-family: inherit; font-weight: 700; border: 2px solid #E8EAE7; border-radius: 9px; outline: none; color: #2A332F; background: white; -webkit-appearance: none; }
.si-field input:focus, .si-field select:focus { border-color: #D6C9E4; }
.si-field select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238D83A8' stroke-width='3'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 8px center; background-size: 14px; padding-right: 26px; }
.go-btn { width: 100%; background: #EDE4F4; color: #5A4A6A; border: none; padding: 13px; border-radius: 999px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.go-btn:hover { background: #E3D7EE; } .go-btn:active { background: #D9CAE7; }
.go-btn:disabled { opacity: .55; cursor: not-allowed; }
@media (max-width: 400px) { .si-sum { flex-wrap: wrap; } .si-sum .si-txt { flex-basis: calc(100% - 58px); } .si-sum .si-go { margin-left: 58px; } }

/* ===== 단원 고르기 ===== */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 22px 2px 10px; flex-wrap: wrap; }
.sec-head h2 { font-family: 'Gowun Batang', serif; font-size: 15px; font-weight: 700; color: #2A332F; letter-spacing: -.3px; }
.sec-head .sec-note { font-size: 11.5px; color: #4F5C56; }
.cats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.cat-card { display: flex; flex-direction: column; gap: 11px; background: #fff; border: none; border-radius: 16px; padding: 15px 16px; text-align: left; cursor: pointer; font: inherit; transition: transform .14s ease; -webkit-tap-highlight-color: transparent; }
.cat-card:hover { transform: translateY(-2px); }
.cat-card .ctop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cat-card .cname { font-family: 'Gowun Batang', serif; font-size: 15px; font-weight: 700; color: #2A332F; letter-spacing: -.3px; }
.cat-card .cstars { display: flex; gap: 3px; flex: none; }
.cat-card .cstars i { width: 11px; height: 11px; display: block; background: #EEF1EF; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.cat-card .cstars i.on { background: #FFC21F; }
.cat-card .ccnt { font-size: 11.5px; color: #4F5C56; }
.cat-card .cbar { height: 6px; border-radius: 99px; background: #EEF2EF; overflow: hidden; }
.cat-card .cbar i { display: block; height: 100%; border-radius: 99px; background: #B9A5CC; width: 0; }
.cat-card .cstat { font-size: 11px; color: #5C6A64; }
.cat-card.soon { background: rgba(255,255,255,.6); cursor: default; }
.cat-card.soon:hover { transform: none; }
.cat-card.soon .cname { color: #3F4A44; }
.cat-card.soon .clock { width: 16px; height: 16px; flex: none; color: #5C6A64; }
.cat-card.soon .ccnt, .cat-card.soon .cstat { color: #4F5C56; }
.cat-card.soon .cbar { background: rgba(238,242,239,.7); }
.cat-back { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 10px; font: inherit; font-size: 13px; font-weight: 700; color: #4F5C56; background: none; border: none; cursor: pointer; padding: 4px 2px; -webkit-tap-highlight-color: transparent; }
.cat-back svg { width: 15px; height: 15px; }
.lvl-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 2px 12px; }
.lvl-tab { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 999px; background: #fff; border: none; color: #4F5C56; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.lvl-tab .n { font-weight: 400; color: #5C6A64; margin-left: 5px; font-size: 12px; }
.lvl-tab.on { background: #EDE4F4; color: #5A4A6A; }
.lvl-tab.on .n { color: #5A4A6A; }
.sec-title { font-family: 'Gowun Batang', serif; font-size: 15px; font-weight: 700; color: #2A332F; margin: 6px 2px 10px; }
.sec-title .sec-meta { font-family: 'Gowun Dodum', sans-serif; font-weight: 400; color: #4F5C56; font-size: 12px; margin-left: 6px; }
/* 스테이지 맵 — 세트 카드(스테이지 5개) */
.setlist { display: flex; flex-direction: column; gap: 10px; }
.setcard { background: white; border: 1px solid #E5EDE8; border-radius: 16px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.setcard.cur { border-color: #D6C9E4; }
.setcard.locked { opacity: .8; }
.set-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.set-head .sn { font-family: 'Gowun Batang', serif; font-size: 14px; font-weight: 700; color: #2A332F; }
.setcard.locked .set-head .sn { color: #5C6A64; }
.set-head .sr { font-size: 11.5px; color: #4F5C56; }
.set-head .sg { font-size: 11px; color: #5C6A64; }
.set-head .right { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: #5A4A6A; }
.set-head .right.star { background: #EDE4F4; border-radius: 999px; padding: 5px 10px; }
.set-head .right.lock { color: #5C6A64; font-weight: 400; }
.set-head .right svg { width: 12px; height: 12px; }
.nodes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.node { display: flex; flex-direction: column; align-items: center; gap: 5px; border: none; background: none; padding: 0; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.node .nb { width: 50px; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: 'Do Hyeon', 'Gowun Dodum', sans-serif; font-size: 19px; background: #F0F3F1; color: #5C6A64; }
.node .nb svg { width: 22px; height: 22px; }
.node .nl { font-size: 11px; font-weight: 700; color: #5C6A64; }
.node.pass .nb { background: #E4F1EA; color: #3E9B74; } .node.pass .nl { color: #3E9B74; }
.node.open .nb { background: #EDE4F4; color: #5A4A6A; } .node.open .nl { color: #5A4A6A; }
.node.cur .nb { background: #6B5B7B; color: #fff; } .node.cur .nl { color: #5A4A6A; }
.node.lock { cursor: default; } .node.lock .nb { color: #B7BFB9; } .node.lock .nb svg { width: 18px; height: 18px; }
.now { display: flex; align-items: center; gap: 12px; background: #FAF7FC; border-radius: 12px; padding: 11px 12px; }
.now .nt { flex: 1; min-width: 0; }
.now .nt b { display: block; font-size: 13px; color: #2A332F; }
.now .nt span { font-size: 11.5px; color: #4F5C56; }
.now .go { flex: none; display: inline-flex; align-items: center; gap: 5px; background: #EDE4F4; color: #5A4A6A; border: none; border-radius: 999px; padding: 11px 16px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent; }
.now .go:hover { background: #E3D7EE; } .now .go:active { background: #D9CAE7; }
.now .go svg { width: 14px; height: 14px; }
.stage-note { font-size: 11.5px; color: #4F5C56; text-align: center; line-height: 1.7; }
.pv-band { background: #EDE4F4; color: #5A4A6A; border-radius: 14px; padding: 11px 14px; font-size: 12.5px; font-weight: 700; line-height: 1.5; margin-bottom: 12px; }
.pv-band span { font-weight: 400; }
.back-top { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 10px; font-size: 13px; font-weight: 700; color: #4F5C56; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.back-top svg { width: 15px; height: 15px; }
.hidden { display: none !important; }
footer { text-align: center; margin-top: 28px; color: #5C6A64; font-size: 12px; line-height: 1.9; }
</style>
</head>
<body>
<div class="container">
    <a class="back-top hidden" id="back-top" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>내 페이지로</a>
    <div class="pv-band hidden" id="pv-band">미리보기(선생님용) — <span>모든 스테이지가 열려 있고, 응시해도 기록되지 않아요.</span></div>
    <div class="header">
        <div class="h-left">
            <div class="logo">SHUEGUK</div>
            <h1>문법 스테이지</h1>
            <p class="intro">단원을 골라 스테이지를 하나씩 깨요. 정답률 70%를 넘기면 통과, 세트 5개를 다 모으면 별 +1.</p>
        </div>
        <div class="h-right">
            <svg class="bigstar" id="bigstar" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
            <div class="mystars" id="mystars">문법 별 0개</div>
            <a class="pill-btn" id="top30-link" href="top30.html">탑30 보기</a>
        </div>
    </div>

    <div class="student-info" id="student-info">
        <div class="si-sum" id="si-sum">
            <img class="none" id="si-img" alt="" />
            <div class="si-txt"><span class="si-nm" id="si-sum-text"></span><span class="si-sub" id="si-sum-sub">내 진행 확인을 누르면 스테이지 진행 상황이 보여요.</span></div>
            <button type="button" class="si-go" id="sum-btn">내 진행 확인</button>
            <button type="button" class="si-edit" id="si-edit">수정</button>
        </div>
        <div class="si-body">
            <div class="si-title">학생 정보 <button type="button" class="si-edit hidden" id="si-fold">접기</button></div>
            <div class="si-row">
                <div class="si-field"><label for="si-name">이름</label><input type="text" id="si-name" placeholder="박보검" autocomplete="off"></div>
            </div>
            <div class="si-row">
                <div class="si-field"><label for="si-school">학교</label><input type="text" id="si-school" placeholder="○○중 또는 ○○고" autocomplete="off"></div>
                <div class="si-field small"><label for="si-grade">학년</label>
                    <select id="si-grade"><option value="">선택</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option></select>
                </div>
            </div>
            <div class="si-row">
                <div class="si-field"><label for="si-phone8">학부모님 휴대전화번호 8자리</label><input type="text" id="si-phone8" inputmode="numeric" maxlength="8" placeholder="12345678" autocomplete="off"></div>
            </div>
            <button type="button" class="go-btn" id="check-btn">내 진행 확인하기</button>
        </div>
    </div>

    <!-- 단원 고르기 — 활성화된 단원·레벨·회차를 골라 응시 (2026-09-14 사용자 요청 "모든 학생이 자유롭게"). 배정 목록은 2026-09-16 티쳐스 배정 기능 중단으로 뺐다. -->
    <div id="free">
        <div class="sec-head"><h2>단원 고르기</h2><span class="sec-note">단원 → 레벨 → 스테이지</span></div>
        <div id="cat-view">
            <div class="cats" id="cats"></div>
        </div>
        <div id="round-view" class="hidden">
            <button type="button" class="cat-back" id="cat-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                단원 목록으로</button>
            <div class="lvl-tabs" id="lvl-tabs" hidden></div>
            <div class="sec-title" id="sec-title"></div>
            <div class="stage-note" id="stage-note"></div>
            <div class="setlist" id="stages"></div>
        </div>
    </div>

    <footer>이수경국어 Shueguk</footer>
</div>

<script src="manifest.js"></script>
<script src="stage.js"></script>
<script>
(function() {
    var LS_KEY = 'gramma_student';
    // 별 획득 여부 표시 — 수파베이스 gramma_status(이름+8자리로 내 결과만). 실패해도 목록은 그대로.
    var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
    var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';

    function $(id) { return document.getElementById(id); }
    function esc(s) { return ('' + (s == null ? '' : s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    var CATS = {};
    var CAT_LIST = (window.GRAMMA && GRAMMA.categories) || [];
    var TESTS = (window.GRAMMA && GRAMMA.tests) || {};
    CAT_LIST.forEach(function(c) { CATS[c.code] = c.label; });
    var STARS = {};   // 'unit|round' → gramma_status 항목
    var STATUS = null; // gramma_status 응답 원문 (스테이지 맵 진행 상태 — STAGE.progress가 읽는다)
    var PASS = window.STAGE ? STAGE.PASS_PCT : 70;

    // 지난 입력 기억 + 개인 페이지 등에서 주소로 넘어온 값 우선
    var params = new URLSearchParams(location.search);
    // 미리보기(티쳐스 [참여하기] — 2026-09-16 사용자 "참여하기(이것은 미리보기 기능입니다)"): 학생 정보 없이 모든 스테이지가 열리고 play.html?preview=1로 가서 기록되지 않는다.
    var PREVIEW = params.get('preview') === '1';
    if (PREVIEW) { $('pv-band').classList.remove('hidden'); $('student-info').classList.add('hidden'); }
    // 상위 메뉴(학생 개인 페이지 s.html)로 돌아가기 — 개인 페이지 카드가 같은 탭에서 여니까 돌아갈 길이 필요하다(2026-09-16 사용자 "상위 메뉴로 가기 버튼이 없나요?").
    // 주소는 ?back= 이 있으면 그것, 없으면 넘어온 주소(referrer — 같은 사이트라 접근 코드까지 온다)를 sessionStorage에 기억해 play.html에 다녀와도 유지한다.
    (function() {
        var BACK_KEY = 'gramma_back', back = params.get('back') || '';
        var ref = document.referrer || '';
        if (!back && /coke4497-sys\.github\.io\/shueguk-report\/s\.html/.test(ref)) back = ref;
        if (!back && /localhost|127\.0\.0\.1/.test(location.host) && /\/s\.html\?/.test(ref)) back = ref;   // 검사용
        try { if (back) sessionStorage.setItem(BACK_KEY, back); else back = sessionStorage.getItem(BACK_KEY) || ''; } catch (e) {}
        if (!PREVIEW && back && /^https?:\/\//.test(back)) { $('back-top').href = back; $('back-top').classList.remove('hidden'); }
    })();
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) {}
    $('si-name').value = (params.get('name') || saved.name || '').trim();
    $('si-school').value = (params.get('school') || saved.school || '').trim();
    var g = (params.get('grade') || saved.grade || '').trim();
    if (g) $('si-grade').value = g;
    $('si-phone8').value = ((params.get('p8') || saved.phone8 || '') + '').replace(/[^0-9]/g, '').slice(0, 8);
    $('si-phone8').addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8); });

    /* 학생 정보 카드 — 이미 입력한 학생은 요약 한 줄(2026-09-16 지시서). [수정]으로 펼침. */
    function siSummary() {
        var w = readInfo(), ok = infoOk(w);
        $('si-sum-text').textContent = ok ? (w.name + ' · ' + w.school + ' ' + w.grade) : '학생 정보를 입력해 주세요';
        return ok;
    }
    function siOpen(open) {
        var card = $('student-info');
        card.classList.toggle('collapsed', !open);
        $('si-fold').classList.toggle('hidden', !open || !infoOk(readInfo()));
    }
    function siImg() { var img = $('si-img'); if (img.getAttribute('src')) return; img.onload = function() { img.classList.remove('none'); }; img.onerror = function() { img.classList.add('none'); }; img.src = 'assets/sk-school.png'; }
    // [내 진행 확인] — 정보를 기억하고 진행 상황(gramma_status)을 받아 온다. 배정 목록은 없다(2026-09-16 티쳐스 배정 기능 중단).
    function check() {
        var w = readInfo();
        if (!infoOk(w)) { alert('이름·학교·학년·학부모님 휴대전화번호 8자리를 모두 입력해 주세요!'); siOpen(true); return; }
        try { localStorage.setItem(LS_KEY, JSON.stringify(w)); } catch (e) {}
        siSummary(); siOpen(false); siImg();
        $('si-sum-sub').textContent = '진행 상황을 불러오는 중…';
        loadStars({ name: w.name, phone8: w.phone8 });
    }

    // 진행 상황 — 수파베이스 gramma_status(이름+8자리로 내 결과만). 히어로 별·요약 줄·단원 카드·스테이지 맵이 이 응답을 쓴다.
    function loadStars(who) {
        fetch(SB_URL + '/rest/v1/rpc/gramma_status', {
            method: 'POST', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p: { name: who.name, phone8: who.phone8 } })
        }).then(function(r) { return r.json(); }).then(function(res) {
            if (!res || res.ok !== true) { $('si-sum-sub').textContent = '진행 상황을 불러오지 못했어요. 다시 눌러 주세요.'; return; }
            STARS = {}; STATUS = res;
            (res.items || []).forEach(function(it) { STARS[it.unit + '|' + it.round] = it; });
            var stars = res.stars || 0, sets = (res.sets || []).length, passed = (res.items || []).filter(function(it) { return it.pass != null ? it.pass : Number(it.best) >= PASS; }).length;
            $('mystars').textContent = '문법 별 ' + stars + '개';
            $('bigstar').classList.toggle('on', stars > 0);
            $('si-sum-sub').textContent = passed ? '통과한 스테이지 ' + passed + '개 · 세트 ' + sets + '개 클리어 · 문법 별 ' + stars + '개' : '아직 통과한 스테이지가 없어요. 단원을 골라 첫 스테이지에 도전해요.';
            renderCats();
            if (current) renderStages();
        }).catch(function() { $('si-sum-sub').textContent = '진행 상황을 불러오지 못했어요. 다시 눌러 주세요.'; });
    }

    /* ===== 자유 응시 — 단원 카드 → 레벨 탭 → 회차 (assign.html과 같은 규칙: menu/level/group) ===== */
    function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
    function roundsOf(code) {
        var out = [];
        Object.keys(TESTS).forEach(function(k) { var m = k.match(/^(.+)-(\d+)$/); if (m && m[1] === code) out.push(parseInt(m[2], 10)); });
        return out.sort(function(a, b) { return a - b; });
    }
    function catOf(code) { return CAT_LIST.filter(function(x) { return x.code === code; })[0] || {}; }
    function menuOf(c) { return c.menu || c.code; }
    function levelsOf(menu) { return CAT_LIST.filter(function(c) { return menuOf(c) === menu; }); }
    function groupOf(cat, n) { var t = TESTS[cat + '-' + n]; return (t && t.group) || ''; }
    function menuTitle(code) {   // '한글 맞춤법 · 레벨2'
        var c = catOf(code);
        if (!c.level) return CATS[code] || code;
        var top = catOf(menuOf(c));
        return (top.label || c.label) + ' · ' + c.level;
    }
    var IC_LOCK_S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    var current = '';
    // 단원 카드 — 이름 + 별 4개(클리어한 세트 수) + 회차 정보 + 진행 막대(통과 스테이지 비율) + 상태 한 줄. 준비 중 단원은 아래 한 줄로.
    function renderCats() {
        var wrap = $('cats');
        if (!wrap) return;
        var html = '';
        CAT_LIST.forEach(function(c) {
            if (c.menu) return;                              // 다른 카드 안의 레벨
            var levels = levelsOf(c.code), total = 0, parts = [], passed = 0, stars = 0;
            levels.forEach(function(l) {
                var n = roundsOf(l.code).length; total += n;
                if (n && levels.length > 1) parts.push(esc(l.level || l.label) + ' ' + n + '회');
                if (n && STATUS) { var pg = STAGE.progress(l.code, CATS[l.code] || l.label, STATUS); roundsOf(l.code).forEach(function(r) { if (pg.pass[r]) passed++; }); stars += Object.keys(pg.cleared).length; }
            });
            if (!total) {   // 준비 중 단원도 같은 카드로, 별 자리에 자물쇠(2026-09-16 사용자 "준비중인 단원의 카드도 만들어주세요. 자물쇠 아이콘을 달아서요")
                html += '<button type="button" class="cat-card soon" data-code="' + escAttr(c.code) + '" disabled aria-disabled="true">' +
                    '<span class="ctop"><span class="cname">' + esc(c.label) + '</span><span class="clock" aria-label="준비 중">' + IC_LOCK_S + '</span></span>' +
                    '<span class="ccnt">준비 중이에요</span><span class="cbar"><i style="width:0"></i></span><span class="cstat">문항이 준비되면 열려요</span></button>';
                return;
            }
            var pct = total ? Math.round(passed / total * 100) : 0;
            var starsHtml = ''; for (var i = 0; i < 4; i++) starsHtml += '<i class="' + (i < stars ? 'on' : '') + '"></i>';
            html += '<button type="button" class="cat-card" data-code="' + escAttr(c.code) + '">' +
                '<span class="ctop"><span class="cname">' + esc(c.label) + '</span><span class="cstars" title="클리어한 세트 ' + stars + '개">' + starsHtml + '</span></span>' +
                '<span class="ccnt">' + (parts.length ? parts.join(' · ') : '전체 ' + total + '회') + '</span>' +
                '<span class="cbar"><i style="width:' + pct + '%"></i></span>' +
                '<span class="cstat">' + (passed ? passed + ' / ' + total + ' 통과' : '아직 시작하지 않았어요') + '</span></button>';
        });
        wrap.innerHTML = html;

    }
    $('cats').addEventListener('click', function(ev) { var b = ev.target.closest('.cat-card'); if (b) openMenu(b.getAttribute('data-code')); });
    renderCats();
    function openMenu(menu) {
        var levels = levelsOf(menu).filter(function(l) { return roundsOf(l.code).length; });
        openCat(levels.length ? levels[0].code : menu);
        $('cat-view').classList.add('hidden');
        $('round-view').classList.remove('hidden');
        $('free').scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
    function openCat(code) {
        current = code;
        var levels = levelsOf(menuOf(catOf(code))).filter(function(l) { return roundsOf(l.code).length; });
        var box = $('lvl-tabs');
        box.hidden = levels.length < 2;
        box.innerHTML = levels.map(function(l) {
            return '<button type="button" class="lvl-tab' + (l.code === current ? ' on' : '') + '" data-code="' + escAttr(l.code) + '">' +
                esc(l.level || l.label) + '<span class="n">' + roundsOf(l.code).length + '회</span></button>';
        }).join('');
        renderStages();
    }
    $('lvl-tabs').addEventListener('click', function(ev) {
        var b = ev.target.closest('.lvl-tab');
        if (b && b.getAttribute('data-code') !== current) openCat(b.getAttribute('data-code'));
    });
    $('cat-back').addEventListener('click', function() {
        $('round-view').classList.add('hidden');
        $('cat-view').classList.remove('hidden');
    });
    var IC_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
    var IC_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    var IC_STAR = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
    var IC_GO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    function titleOf(cat, n) { var t = TESTS[cat + '-' + n]; return (t && t.title) ? t.title : (CATS[cat] || cat) + ' ' + n + '회'; }
    // 스테이지 맵 — 세트(5개)마다 카드, 진행 상태는 STAGE.progress(gramma_status 응답)에서
    function renderStages() {
        var label = CATS[current] || current, sets = STAGE.setsOf(current), rounds = STAGE.roundsOf(current);
        var pg = STAGE.progress(current, label, STATUS || {});
        if (PREVIEW) rounds.forEach(function(r) { pg.open[r] = true; });   // 미리보기는 전부 열림
        var passed = rounds.filter(function(r) { return pg.pass[r]; }).length;
        var hasInfo = infoOk(readInfo());
        $('sec-title').innerHTML = esc(menuTitle(current)) + '<span class="sec-meta">스테이지 ' + rounds.length + ' · 세트 ' + sets.length + (STATUS ? ' · 통과 ' + passed : '') + '</span>';
        stageNote();
        var curRound = null;
        rounds.forEach(function(r) { if (curRound == null && pg.open[r] && !pg.pass[r]) curRound = r; });
        if (curRound == null && rounds.length && !pg.pass[rounds[rounds.length - 1]]) curRound = rounds[0];
        var html = '';
        sets.forEach(function(s) {
            var cleared = !!pg.cleared[s.no] || s.rounds.every(function(r) { return pg.pass[r]; });
            var locked = !pg.open[s.rounds[0]];
            var n = s.rounds.filter(function(r) { return pg.pass[r]; }).length;
            var groups = []; s.rounds.forEach(function(r) { var g = groupOf(current, r); if (g && groups.indexOf(g) < 0) groups.push(g); });
            var isCur = s.rounds.indexOf(curRound) >= 0;
            html += '<div class="setcard' + (isCur ? ' cur' : '') + (locked ? ' locked' : '') + '" data-set="' + s.no + '">' +
                '<div class="set-head"><span class="sn">세트 ' + s.no + '</span><span class="sr">스테이지 ' + s.rounds[0] + '~' + s.rounds[s.rounds.length - 1] + '</span>' +
                (groups.length ? '<span class="sg">' + esc(groups.join(' · ')) + '</span>' : '') +
                (cleared ? '<span class="right star">' + IC_STAR + '별 획득</span>' : locked ? '<span class="right lock">' + IC_LOCK + '앞 세트를 클리어하면 열려요</span>' : '<span class="right">' + n + ' / ' + s.rounds.length + ' 클리어</span>') +
                '</div><div class="nodes">';
            s.rounds.forEach(function(r) {
                var st = pg.pass[r] ? 'pass' : (r === curRound ? 'cur' : (pg.open[r] ? 'open' : 'lock'));
                var best = pg.best[r];
                html += '<button type="button" class="node ' + st + '" data-round="' + r + '" title="' + escAttr(titleOf(current, r)) + '">' +
                    '<span class="nb">' + (st === 'pass' ? IC_CHECK : st === 'lock' ? IC_LOCK : r) + '</span>' +
                    '<span class="nl">' + (st === 'pass' ? best + '%' : st === 'cur' ? '도전' + (best != null ? ' · ' + best + '%' : '') : st === 'open' ? (best != null ? best + '%' : '열림') : r) + '</span></button>';
            });
            html += '</div>';
            if (isCur) html += '<div class="now"><div class="nt"><b>스테이지 ' + curRound + ' · ' + esc(titleOf(current, curRound)) + '</b><span>문항마다 30초 · 통과 ' + PASS + '%' + (pg.best[curRound] != null ? ' · 최고 ' + pg.best[curRound] + '%' : '') + '</span></div>' +
                '<button type="button" class="go" data-round="' + curRound + '">도전하기' + IC_GO + '</button></div>';
            html += '</div>';
        });
        if (!sets.length) html = '<div class="stage-note">아직 스테이지가 없어요.</div>';
        $('stages').innerHTML = html;
    }
    // 학생 정보 읽기 — 넷 다 있어야 응시 링크를 만든다(테스트 페이지에 이름·학교·학년·전화 8자리가 채워져 열리게)
    function readInfo() {
        return { name: ($('si-name').value || '').trim(), school: ($('si-school').value || '').trim(), grade: $('si-grade').value || '', phone8: ($('si-phone8').value || '').trim() };
    }
    function infoOk(w) { return !!(w.name && w.school && w.grade && /^[0-9]{8}$/.test(w.phone8)); }
    $('stages').addEventListener('click', function(ev) {
        var b = ev.target.closest('button.go, button.node');
        if (!b) return;
        if (b.classList.contains('lock')) { alert('앞 스테이지를 ' + PASS + '% 이상으로 통과하면 열려요.'); return; }
        if (PREVIEW) { location.href = 'play.html?c=' + encodeURIComponent(current) + '&r=' + encodeURIComponent(b.getAttribute('data-round')) + '&preview=1'; return; }
        var who = readInfo();
        if (!infoOk(who)) {
            alert('응시 전에 위 학생 정보(이름·학교·학년·학부모님 휴대전화번호 8자리)를 먼저 입력해 주세요!');
            siOpen(true); document.querySelector('.student-info').scrollIntoView({ block: 'center', behavior: 'smooth' });
            var miss = !who.name ? 'si-name' : !who.school ? 'si-school' : !who.grade ? 'si-grade' : 'si-phone8';
            try { $(miss).focus(); } catch (e) {}
            return;
        }
        try { localStorage.setItem(LS_KEY, JSON.stringify(who)); } catch (e) {}
        location.href = playUrl(current, b.getAttribute('data-round'), who);
    });
    function playUrl(cat, round, who) {
        return 'play.html?c=' + encodeURIComponent(cat) + '&r=' + encodeURIComponent(round) +
            '&name=' + encodeURIComponent(who.name) + '&school=' + encodeURIComponent(who.school) + '&grade=' + encodeURIComponent(who.grade) + '&p8=' + encodeURIComponent(who.phone8 || '');
    }

    $('check-btn').addEventListener('click', check);
    $('sum-btn').addEventListener('click', check);
    $('si-edit').addEventListener('click', function() { siOpen(true); try { $('si-name').focus(); } catch (e) {} });
    $('si-fold').addEventListener('click', function() { if (infoOk(readInfo())) { siSummary(); siOpen(false); } });
    function syncTop30() { var w = readInfo(); $('top30-link').href = 'top30.html' + (infoOk(w) ? '?name=' + encodeURIComponent(w.name) + '&school=' + encodeURIComponent(w.school) + '&grade=' + encodeURIComponent(w.grade) + '&p8=' + encodeURIComponent(w.phone8) : ''); }
    // 정보 칸이 바뀌면 안내 글·탑30 링크만 갱신한다 — 여기서 스테이지 맵을 다시 그리면 안 된다(change는 칸을 떠날 때 나므로
    // [도전하기]를 누르는 순간 버튼이 새로 만들어져 클릭이 사라진다. E2E에서 실제로 잡힘)
    function stageNote() { if (!current) return; if (PREVIEW) { $('stage-note').textContent = '미리보기 — 아무 스테이지나 눌러 학생 화면 그대로 풀어 볼 수 있어요(기록 없음).'; return; } var hasInfo = infoOk(readInfo()); $('stage-note').textContent = !hasInfo ? '학생 정보를 입력하면 내 진행 상황이 보여요. 지금은 첫 스테이지만 열려 있어요.' : (!STATUS ? '진행 상황을 불러오는 중…' : ''); }
    ['si-name', 'si-school', 'si-grade', 'si-phone8'].forEach(function(id) { $(id).addEventListener('input', function() { syncTop30(); stageNote(); siSummary(); }); $(id).addEventListener('change', function() { syncTop30(); stageNote(); siSummary(); }); });
    syncTop30();
    (function() { if (PREVIEW) return; var w = readInfo(); if (infoOk(w)) { siSummary(); siOpen(false); siImg(); loadStars({ name: w.name, phone8: w.phone8 }); } else { siSummary(); siOpen(true); } })();
    (function() {   // play.html에서 돌아올 때 #c=코드 — 그 단원의 스테이지 맵을 바로 연다
        var m = (location.hash || '').match(/^#c=([^&]+)/);
        if (m) { var code = decodeURIComponent(m[1]), c = catOf(code); if (c.code && STAGE.roundsOf(code).length) { openMenu(menuOf(c)); if (code !== current) openCat(code); } }
    })();
})();
</script>
</body>
</html>
