<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>문법 링크 발송 · 슈국 티쳐스</title>
<meta name="description" content="이수경국어 문법 테스트 — 카테고리·회차별 학생 발송 링크 복사" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #C6D5D2;
  min-height: 100vh; color: #2C2F2D; padding: 16px 16px 80px; -webkit-text-size-adjust: 100%;
}
.container { max-width: 640px; margin: 0 auto; }

.back { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 10px; color: #6A716C; text-decoration: none; font-size: 13px; font-weight: 700; }
.back svg { width: 16px; height: 16px; }
.back:hover { color: #628C83; }

.header { text-align: center; margin-bottom: 14px; padding: 18px 16px 16px; background: white; border-radius: 20px; box-shadow: 0 4px 16px rgba(45,128,104,0.08); border: 2px solid #C6D5D2; }
.header .logo { font-family: 'Gowun Batang', serif; font-size: 11px; font-weight: 800; letter-spacing: 5px; color: #A6C1BB; margin-bottom: 6px; }
.header h1 { font-family: 'Gowun Batang', serif; font-size: 22px; font-weight: 800; color: #3A544E; letter-spacing: -0.5px; }
.header .intro { font-size: 13px; color: #6A716C; margin-top: 8px; line-height: 1.7; }

.unit-title { font-family: 'Gowun Batang', serif; font-size: 15px; font-weight: 800; color: #3A544E; margin: 6px 2px 10px; }

.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; background: white; border: 2px solid #F1F6F4; border-radius: 13px; padding: 12px 14px; }
.rd { flex: none; width: 52px; font-family: 'Gowun Batang', serif; font-weight: 800; color: #628C83; font-size: 15px; }
.ttl { flex: 1; min-width: 0; font-size: 13.5px; color: #2C2F2D; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { flex: none; display: flex; gap: 8px; align-items: center; }
.open { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #628C83; text-decoration: none; }
.open svg { width: 14px; height: 14px; }
.copy { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; font-weight: 700; color: #3A544E;
  background: #E9F0EF; border: 1.5px solid #C6D5D2; border-radius: 9px; padding: 7px 12px; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s; -webkit-tap-highlight-color: transparent; }
.copy svg { width: 13px; height: 13px; }
.copy:hover { border-color: #A6C1BB; }
.copy.done { color: #276B4E; background: #E4F1EA; border-color: #3E9B74; }

footer { text-align: center; margin-top: 32px; color: #8B928C; font-size: 12px; line-height: 1.9; }
@media (max-width: 430px){ .ttl { white-space: normal; } }
@media (prefers-reduced-motion: reduce){ * { transition: none !important; } }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="https://coke4497-sys.github.io/shueguk-hub/gramma.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    문법 테스트
  </a>

  <div class="header">
    <div class="logo">SHUEGUK</div>
    <h1>문법 링크 발송</h1>
    <p class="intro">카테고리·회차별 학생 응시 링크입니다.<br />"링크 복사"를 눌러 학생에게 보내세요.<br />배정한 학생에게는 아래 '내 문법 테스트' 링크 하나면 돼요.</p>
  </div>

  <div id="sections"></div>

  <footer>이수경국어 Shueguk · 교사용</footer>
</div>

<script src="manifest.js"></script>
<script>
(function(){
  var BASE_URL = 'https://coke4497-sys.github.io/shueguk-gramma/';

  function $(id){ return document.getElementById(id); }
  function escapeHtml(s){ return ('' + s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function rowHtml(rd, ttl, url){
    return '<div class="row">' +
      '<span class="rd">' + escapeHtml(rd) + '</span>' +
      '<span class="ttl">' + escapeHtml(ttl) + '</span>' +
      '<span class="acts">' +
        '<a class="open" href="' + url + '" target="_blank" rel="noopener">미리보기' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>' +
        '<button type="button" class="copy" data-url="' + url.replace(/&preview=1$/, '') + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          '링크 복사</button>' +
      '</span></div>';
  }

  var box = $('sections');
  var html = '';

  // 학생 공통 입구 — 배정 확인 페이지
  html += '<div class="unit-title">학생 공통 입구</div><div class="list">' +
    rowHtml('입구', '내 문법 테스트 (배정 확인·응시)', BASE_URL + 'index.html') + '</div>';

  var cats = (window.GRAMMA && GRAMMA.categories) || [];
  var tests = (window.GRAMMA && GRAMMA.tests) || {};
  var pending = [];
  cats.forEach(function(c){
    var rounds = [];
    Object.keys(tests).forEach(function(k){
      var m = k.match(/^(.+)-(\d+)$/);
      if (m && m[1] === c.code) rounds.push(parseInt(m[2],10));
    });
    rounds.sort(function(a,b){ return a-b; });
    if (!rounds.length){ pending.push(c.label); return; }
    html += '<div class="unit-title">' + escapeHtml(c.label) + ' · 전체 ' + rounds.length + '회</div><div class="list">';
    rounds.forEach(function(n){
      var t = tests[c.code + '-' + n];
      var url = BASE_URL + 'test.html?c=' + c.code + '&r=' + n + '&preview=1';
      html += rowHtml(n + '회', c.label + ' ' + n + '회' + (t && t.title ? ' · ' + t.title : ''), url);
    });
    html += '</div>';
  });
  if (pending.length){
    html += '<div class="unit-title">준비 중</div><div class="list"><div class="row"><span class="ttl">' +
      escapeHtml(pending.join(' · ')) + ' — 문항이 등록되면 여기에 나타납니다.</span></div></div>';
  }
  box.innerHTML = html;

  box.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click', function(){ copyText(btn.getAttribute('data-url'), btn); });
  });

  function copyText(url, btn){
    var done = function(){
      btn.classList.add('done');
      var label = btn.childNodes[btn.childNodes.length - 1];
      label.textContent = '복사됐어요!';
      setTimeout(function(){ btn.classList.remove('done'); label.textContent = '링크 복사'; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ fallback(url, done); });
    } else { fallback(url, done); }
  }
  function fallback(url, done){
    var t = document.createElement('textarea');
    t.value = url; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch(_){ prompt('아래 주소를 복사하세요:', url); }
    document.body.removeChild(t);
  }
})();
</script>
</body>
</html>
