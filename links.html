<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>문법 링크 발송 · 슈국 티쳐스</title>
<meta name="description" content="이수경국어 문법 테스트 — 음운 변동 회차별 학생 발송 링크 복사" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(180deg, #f0faf6 0%, #e8f4ef 100%);
  min-height: 100vh; color: #1f3a32; padding: 16px 16px 80px; -webkit-text-size-adjust: 100%;
}
.container { max-width: 640px; margin: 0 auto; }

.back { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 10px; color: #5a7a70; text-decoration: none; font-size: 13px; font-weight: 700; }
.back svg { width: 16px; height: 16px; }
.back:hover { color: #2d8068; }

.header { text-align: center; margin-bottom: 14px; padding: 18px 16px 16px; background: white; border-radius: 20px; box-shadow: 0 4px 16px rgba(45,128,104,0.08); border: 2px solid #c8e4d8; }
.header .logo { font-family: 'Nanum Myeongjo', serif; font-size: 11px; font-weight: 800; letter-spacing: 5px; color: #5fb8a8; margin-bottom: 6px; }
.header h1 { font-family: 'Nanum Myeongjo', serif; font-size: 22px; font-weight: 800; color: #1f5a48; letter-spacing: -0.5px; }
.header .intro { font-size: 13px; color: #5a7a70; margin-top: 8px; line-height: 1.7; }

.unit-title { font-family: 'Nanum Myeongjo', serif; font-size: 15px; font-weight: 800; color: #1f5a48; margin: 6px 2px 10px; }

.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; background: white; border: 2px solid #ecf5f0; border-radius: 13px; padding: 12px 14px; }
.rd { flex: none; width: 52px; font-family: 'Nanum Myeongjo', serif; font-weight: 800; color: #2d8068; font-size: 15px; }
.ttl { flex: 1; min-width: 0; font-size: 13.5px; color: #1f3a32; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { flex: none; display: flex; gap: 8px; align-items: center; }
.open { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #2d8068; text-decoration: none; }
.open svg { width: 14px; height: 14px; }
.copy { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; font-weight: 700; color: #1f5a48;
  background: #e9f5ef; border: 1.5px solid #c8e4d8; border-radius: 9px; padding: 7px 12px; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s; -webkit-tap-highlight-color: transparent; }
.copy svg { width: 13px; height: 13px; }
.copy:hover { border-color: #5fb8a8; }
.copy.done { color: #1a5c3a; background: #dcf5e8; border-color: #5fbb8a; }

footer { text-align: center; margin-top: 32px; color: #94a3b8; font-size: 12px; line-height: 1.9; }
@media (max-width: 430px){ .ttl { white-space: normal; } }
@media (prefers-reduced-motion: reduce){ * { transition: none !important; } }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="https://coke4497-sys.github.io/shueguk-hub/gramma.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    문법 테스트
  </a>

  <div class="header">
    <div class="logo">SHUEGUK</div>
    <h1>문법 링크 발송</h1>
    <p class="intro">회차별 학생 응시 링크입니다.<br />"링크 복사"를 눌러 학생에게 보내세요.</p>
  </div>

  <div class="unit-title" id="unit-title"></div>
  <div class="list" id="list"></div>

  <footer>이수경국어 Shueguk · 교사용</footer>
</div>

<script>
(function(){
  /* ===== 설정 — 회차가 늘면 ROUNDS만 조정하세요 ===== */
  var BASE_URL = 'https://coke4497-sys.github.io/shueguk-gramma/';
  var UNIT = { label: '음운 변동', rounds: 10, file: function(n){ return 'shueguk-phonology-' + n + '-student.html'; } };

  function $(id){ return document.getElementById(id); }
  function studentUrl(n){ return BASE_URL + UNIT.file(n); }
  function escapeHtml(s){ return ('' + s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  $('unit-title').textContent = UNIT.label + ' · 전체 ' + UNIT.rounds + '회';

  var list = $('list');
  for (var n = 1; n <= UNIT.rounds; n++){
    var url = studentUrl(n);
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<span class="rd">' + n + '회</span>' +
      '<span class="ttl">' + escapeHtml(UNIT.label) + ' ' + n + '회</span>' +
      '<span class="acts">' +
        '<a class="open" href="' + url + '" target="_blank" rel="noopener">미리보기' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>' +
        '<button type="button" class="copy" data-url="' + url + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          '링크 복사</button>' +
      '</span>';
    list.appendChild(row);
  }

  list.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click', function(){ copyText(btn.getAttribute('data-url'), btn); });
  });

  function copyText(url, btn){
    var done = function(){
      btn.classList.add('done');
      var label = btn.childNodes[btn.childNodes.length - 1];
      label.textContent = '복사됐어요!';
      setTimeout(function(){ btn.classList.remove('done'); label.textContent = '링크 복사'; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ fallback(url, done); });
    } else { fallback(url, done); }
  }
  function fallback(url, done){
    var t = document.createElement('textarea');
    t.value = url; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch(_){ prompt('아래 주소를 복사하세요:', url); }
    document.body.removeChild(t);
  }
})();
</script>
</body>
</html>
